<!DOCTYPE html>
<html lang="ml">
<head>
  <!-- Google tag (gtag.js) -->

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shameel's Tic-Tac-Toe</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #020617;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      overflow-x: hidden;
    }

    .hidden { display: none !important; }

    /* FULL POSTER WRAPPER */
    #start-screen {
      position: relative;
      width: 100%;
      max-width: 420px;
      border-radius: 26px;
      overflow: hidden;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(56, 189, 248, 0.25);
      border: 1.5px solid rgba(56, 189, 248, 0.3);
      user-select: none;
    }

    .poster-img {
      width: 100%;
      height: auto;
      display: block;
      pointer-events: none;
    }

    /* DIRECT ON-IMAGE CLICKABLE HOTSPOTS */
    .hotspot {
      position: absolute;
      cursor: pointer;
      border-radius: 14px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.001);
      border: 2px solid transparent;
      transition: all 0.2s ease;
    }

    /* Mode: Unbeatable AI */
    #hotspot-ai {
      top: 50%;
      left: 13%;
      width: 40%;
      height: 8%;
    }

    /* Mode: 2 Players */
    #hotspot-2p {
      top: 50%;
      left: 55%;
      width: 32%;
      height: 8%;
    }

    /* Symbol: X */
    #hotspot-x {
      top: 64.5%;
      left: 13%;
      width: 39%;
      height: 8%;
    }

    /* Symbol: O */
    #hotspot-o {
      top: 64.5%;
      left: 54%;
      width: 33%;
      height: 8%;
    }

    /* Active Glowing State over selected option */
    .hotspot.selected {
      border: 2px solid #38bdf8 !important;
      background: rgba(56, 189, 248, 0.28) !important;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.6);
    }

    /* Start Button Hotspot */
    #hotspot-start {
      top: 73.5%;
      left: 12%;
      width: 76%;
      height: 10%;
      border-radius: 9999px;
    }

    #hotspot-start:active {
      background: rgba(250, 204, 21, 0.4) !important;
      box-shadow: 0 0 25px rgba(250, 204, 21, 0.8);
      transform: scale(0.98);
    }

    /* GAME PLAY SCREEN */
    #game-screen {
      width: 100%;
      max-width: 390px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      animation: popIn 0.3s ease;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .game-top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    .scoreboard-box {
      width: 100%;
      display: flex;
      gap: 8px;
    }

    .score-card {
      flex: 1;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #334155;
      padding: 10px 4px;
      border-radius: 16px;
      text-align: center;
    }

    .score-title { font-size: 0.72rem; color: #94a3b8; font-weight: 600; }
    .score-val { font-size: 1.45rem; font-weight: 900; color: #38bdf8; }

    .game-status-bubble {
      background: #1e293b;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 8px 20px;
      border-radius: 9999px;
      font-weight: 700;
      color: #e2e8f0;
      font-size: 0.92rem;
    }

    .game-board {
      width: 100%;
      aspect-ratio: 1/1;
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid rgba(56, 189, 248, 0.3);
      border-radius: 24px;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    }

    .cell {
      background: #090d16;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: 900;
      cursor: pointer;
      border: 1px solid #1e293b;
      user-select: none;
      transition: all 0.15s ease;
    }

    .cell:active { transform: scale(0.94); }
    .cell.x { color: #38bdf8; text-shadow: 0 0 16px rgba(56, 189, 248, 0.8); }
    .cell.o { color: #ec4899; text-shadow: 0 0 16px rgba(236, 72, 153, 0.8); }
    .cell.win-cell { background: #1e3a5f; border-color: #38bdf8; animation: pulseWin 0.8s infinite alternate; }
    @keyframes pulseWin { from { transform: scale(0.98); } to { transform: scale(1.04); } }
  </style>
</head>
<body>

  <!-- FULL 3D POSTER SCREEN WITH DIRECT TOUCH -->
  <div id="start-screen">
    <img src="file_0000000074188208aabdc190d10e5f39.png" alt="3D Tic Tac Toe Poster" class="poster-img">

    <!-- Mode Hotspots -->
    <div id="hotspot-ai" class="hotspot selected" onclick="pickMode('ai')"></div>
    <div id="hotspot-2p" class="hotspot" onclick="pickMode('2p')"></div>

    <!-- Symbol Hotspots -->
    <div id="hotspot-x" class="hotspot selected" onclick="pickSym('X')"></div>
    <div id="hotspot-o" class="hotspot" onclick="pickSym('O')"></div>

    <!-- Start Game Button Hotspot -->
    <div id="hotspot-start" class="hotspot" onclick="launchGame()"></div>
  </div>

  <!-- GAME PLAY SCREEN -->
  <div id="game-screen" class="hidden">
    <div class="game-top-bar">
      <button class="nav-btn" onclick="goToHome()">⬅️ Back</button>
      <span id="label-game-mode" style="font-size:0.85rem; color:#38bdf8; font-weight:700;">Unbeatable AI

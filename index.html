<!DOCTYPE html>
<html lang="ml">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-N7Z24SXFBG"></script>
  <script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shameel's Arcade Zone 🎮</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    /* THEME SYSTEM */
    :root {
      --bg-gradient: radial-gradient(circle at 50% 15%, #18153b 0%, #080811 70%, #030408 100%);
      --accent-color: #38bdf8;
      --card-bg: rgba(15, 23, 42, 0.9);
      --card-border: rgba(56, 189, 248, 0.25);
      --text-main: #f8fafc;
    }

    body.theme-cyber {
      --bg-gradient: radial-gradient(circle at 50% 15%, #2a0845 0%, #0f051d 70%, #05010a 100%);
      --accent-color: #f43f5e;
      --card-bg: rgba(29, 9, 44, 0.92);
      --card-border: rgba(244, 63, 94, 0.35);
      --text-main: #fff1f2;
    }

    body.theme-sunset {
      --bg-gradient: radial-gradient(circle at 50% 15%, #3b1812 0%, #150907 70%, #070302 100%);
      --accent-color: #fb923c;
      --card-bg: rgba(36, 18, 14, 0.92);
      --card-border: rgba(251, 146, 60, 0.35);
      --text-main: #fff7ed;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      overflow-x: hidden;
      transition: background 0.3s ease;
    }

    .hidden { display: none !important; }

    /* =========================================
       5-SECOND WINNER FULLSCREEN MODAL
    ========================================= */
    #winner-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(3, 7, 18, 0.95);
      backdrop-filter: blur(14px);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      animation: modalPop 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes modalPop {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-trophy {
      font-size: 5rem;
      filter: drop-shadow(0 0 30px rgba(250, 204, 21, 0.7));
      animation: floatTrophy 1s alternate infinite ease-in-out;
    }

    @keyframes floatTrophy {
      from { transform: translateY(0); }
      to { transform: translateY(-14px); }
    }

    .modal-headline {
      font-size: 2.2rem;
      font-weight: 900;
      color: #fde047;
      margin-top: 10px;
      text-shadow: 0 0 20px rgba(253, 224, 71, 0.4);
    }

    .modal-name {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--accent-color);
      margin-top: 4px;
    }

    .modal-desc {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-top: 6px;
    }

    .modal-timer-bar {
      width: 150px;
      height: 6px;
      background: #1e293b;
      border-radius: 9999px;
      margin-top: 20px;
      overflow: hidden;
    }

    .modal-timer-fill {
      width: 100%;
      height: 100%;
      background: var(--accent-color);
      animation: timerBar 5s linear forwards;
    }

    @keyframes timerBar {
      from { width: 100%; }
      to { width: 0%; }
    }

    /* =========================================
       ARCADE HUB / HEADER
    ========================================= */
    #hub-screen {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      animation: fadeIn 0.25s ease;
    }

    .hub-top-controls {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
    }

    .control-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hub-header {
      text-align: center;
    }

    .hub-title {
      font-size: 1.9rem;
      font-weight: 900;
      background: linear-gradient(135deg, #38bdf8, #a855f7, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
    }

    .hub-subtitle {
      font-size: 0.82rem;
      color: #94a3b8;
      font-weight: 600;
      margin-top: 2px;
    }

    /* DAILY CHALLENGES */
    .challenge-card {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .challenge-badge {
      font-size: 1.8rem;
    }

    .challenge-info {
      flex: 1;
    }

    .challenge-title {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--accent-color);
    }

    .challenge-status {
      font-size: 0.74rem;
      color: #94a3b8;
      margin-top: 2px;
    }

    /* GAME LIST */
    .game-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .game-card {
      width: 100%;
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 20px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      color: inherit;
      text-align: left;
      transition: all 0.15s ease;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    .game-card:active {
      transform: scale(0.97);
      border-color: var(--accent-color);
    }

    .game-icon-box {
      font-size: 1.8rem;
      min-width: 54px;
      height: 54px;
      background: #060a12;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,0.08);
      flex-shrink: 0;
    }

    .game-meta { flex: 1; }
    .game-title { font-size: 1.05rem; font-weight: 800; color: #ffffff; }
    .game-desc { font-size: 0.74rem; color: #94a3b8; margin-top: 2px; }
    .game-best { font-size: 0.72rem; color: #facc15; font-weight: 700; margin-top: 3px; }
    .game-arrow { font-size: 1.2rem; color: var(--accent-color); font-weight: 900; }

    /* COMMON PLAY WRAPPER */
    .play-screen {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      animation: fadeIn 0.25s ease-out;
    }

    .play-navbar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 7px 12px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .score-bubble {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--accent-color);
    }

    canvas {
      background: #070b14;
      border: 1.5px solid var(--card-border);
      border-radius: 22px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      display: block;
      width: 100%;
      max-height: 480px;
    }

    /* CONTROLS BAR FOR CAR & FLAPPY */
    .car-touch-bar {
      width: 100%;
      display: flex;
      gap: 10px;
    }

    .touch-btn {
      flex: 1;
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      color: #fff;
      font-size: 1.4rem;
      font-weight: 900;
      padding: 14px 0;
      border-radius: 16px;
      cursor: pointer;
      user-select: none;
      transition: all 0.1s ease;
    }

    .touch-btn:active {
      background: var(--accent-color);
      transform: scale(0.95);
    }

    .nitro-btn {
      background: #dc2626 !important;
      border-color: #ef4444 !important;
      font-size: 0.95rem !important;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <!-- =========================================
       5-SECOND WINNER FULLSCREEN MODAL
  ========================================= -->
  <div id="winner-modal" class="hidden">
    <div class="modal-trophy">🏆</div>
    <div class="modal-headline">NEW RECORD!</div>
    <div class="modal-name" id="modal-name">CHAMPION!</div>
    <div class="modal-desc" id="modal-desc">പുതിയ ഹൈസ്കോർ നേടി വിജയിച്ചു! 🎉</div>
    <div class="modal-timer-bar">
      <div class="modal-timer-fill"></div>
    </div>
  </div>

  <!-- =========================================
       ARCADE HUB SCREEN
  ========================================= -->
  <div id="hub-screen">
    <div class="hub-top-controls">
      <button class="control-btn" onclick="cycleTheme()">🎨 <span id="label-theme">Neon</span></button>
      <button class="control-btn" onclick="toggleAudio()">🔊 <span id="label-sound">Sound: ON</span></button>
    </div>

    <div class="hub-header">
      <div class="hub-title">SHAMEEL ARCADE 🎮</div>
      <div class="hub-subtitle">കളിക്കാൻ ഇഷ്ടമുള്ള ഗെയിം തിരഞ്ഞെടുക്കൂ!</div>
    </div>

    <!-- DAILY CHALLENGE CARD -->
    <div class="challenge-card">
      <div class="challenge-badge" id="badge-icon">🎖️</div>
      <div class="challenge-info">
        <div class="challenge-title">ഡെയ്‌ലി ചലഞ്ച്: Speed Demon</div>
        <div class="challenge-status" id="badge-desc">Turbo Racer-ൽ 30 സ്കോർ അടിക്കൂ!</div>
      </div>
    </div>

    <!-- GAME SELECTION LIST -->
    <div class="game-list">
      <!-- 1. Turbo Car Racer -->
      <button type="button" class="game-card" onclick="startAppGame('car')">
        <div class="game-icon-box">🏎️</div>
        <div class="game-meta">
          <div class="game-title">Turbo Car Racer</div>
          <div class="game-desc">Dodge traffic, grab coins & Nitro boost!</div>
          <div class="game-best" id="best-car">Best Score: 0</div>
        </div>
        <div class="game-arrow">➔</div>
      </button>

      <!-- 2. Flappy Jet -->
      <button type="button" class="game-card" onclick="startAppGame('flappy')">
        <div class="game-icon-box">🚀</div>
        <div class="game-meta">
          <div class="game-title">Flappy Jet</div>
          <div class="game-desc">Tap to fly through neon lasers!</div>
          <div class="game-best" id="best-flappy">Best Score: 0</div>
        </div>
        <div class="game-arrow">➔</div>
      </button>

      <!-- 3. Knife Hit / Dart Master -->
      <button type="button" class="game-card" onclick="startAppGame('knife')">
        <div class="game-icon-box">🎯</div>
        <div class="game-meta">
          <div class="game-title">Knife Hit / Dart Master</div>
          <div class="game-desc">Throw knives without hitting each other!</div>
          <div class="game-best" id="best-knife">Best Stage: 1</div>
        </div>
        <div class="game-arrow">➔</div>
      </button>
    </div>
  </div>

  <!-- =========================================
       1. TURBO CAR RACER SCREEN
  ========================================= -->
  <div id="screen-car" class="play-screen hidden">
    <div class="play-navbar">
      <button class="nav-btn" onclick="returnToHub()">🏠 Home</button>
      <div class="score-bubble">Score: <span id="car-score">0</span></div>
      <button class="nav-btn" onclick="initCarGame()">🔄 Retry</button>
    </div>
    <canvas id="car-canvas" width="340" height="420"></canvas>
    <div class="car-touch-bar">
      <button class="touch-btn" onclick="moveCarLane(-1)">⬅️</button>
      <button class="touch-btn nitro-btn" onclick="triggerNitro()">🔥 NITRO</button>
      <button class="touch-btn" onclick="moveCarLane(1)">➡️</button>
    </div>
  </div>

  <!-- =========================================
       2. FLAPPY JET SCREEN
  ========================================= -->
  <div id="screen-flappy" class="play-screen hidden">
    <div class="play-navbar">
      <button class="nav-btn" onclick="returnToHub()">🏠 Home</button>
      <div class="score-bubble">Score: <span id="flappy-score">0</span></div>
      <button class="nav-btn" onclick="initFlappyGame()">🔄 Retry</button>
    </div>
    <canvas id="flappy-canvas" width="340" height="420" onclick="flapJet()"></canvas>
    <div style="font-size:0.75rem; color:#94a3b8; font-weight:600;">സ്ക്രീനിൽ ടാപ്പ് ചെയ്ത് പറക്കൂ! 👆</div>
  </div>

  <!-- =========================================
       3. KNIFE HIT / DART MASTER SCREEN
  ========================================= -->
  <div id="screen-knife" class="play-screen hidden">
    <div class="play-navbar">
      <button class="nav-btn" onclick="returnToHub()">🏠 Home</button>
      <div class="score-bubble">Stage <span id="knife-stage">1</span> | Knives: <span id="knife-count">5</span></div>
      <button class="nav-btn" onclick="initKnifeGame()">🔄 Retry</button>
    </div>
    <canvas id="knife-canvas" width="340" height="420" onclick="throwKnife()"></canvas>
    <div style="font-size:0.75rem; color:#94a3b8; font-weight:600;">കത്തി എറിയാൻ സ്ക്രീനിൽ തൊടുക! 🗡️</div>
  </div>

  <script>
    /* =========================================
       AUDIO & HAPTICS (SYNTHESIZED NATIVE WEB AUDIO)
    ========================================= */
    let isSoundOn = true;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playSound(type) {
      if (!isSoundOn) return;
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'tap') {
          osc.frequency.setValueAtTime(450, now);
          osc.frequency.exponentialRampToValueAtTime(150, now + 0.08);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
          osc.start(now); osc.stop(now + 0.08);
        } else if (type === 'coin') {
          osc.frequency.setValueAtTime(987, now);
          osc.frequency.setValueAtTime(1318, now + 0.08);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
          osc.start(now); osc.stop(now + 0.2);
        } else if (type === 'crash') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(120, now);
          osc.frequency.linearRampToValueAtTime(40, now + 0.3);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          osc.start(now); osc.stop(now + 0.3);
          if (navigator.vibrate) navigator.vibrate(100);
        }
      } catch (e) {}
    }

    function toggleAudio() {
      isSoundOn = !isSoundOn;
      document.getElementById('label-sound').textContent = isSoundOn ? "Sound: ON" : "Sound: OFF";
      playSound('tap');
    }

    /* THEME SWITCHER */
    const themes = ['', 'theme-cyber', 'theme-sunset'];
    const themeNames = ['Default', 'Cyber', 'Sunset'];
    let themeIdx = 0;

    function cycleTheme() {
      themeIdx = (themeIdx + 1) % themes.length;
      document.body.className = themes[themeIdx];
      document.getElementById('label-theme').textContent = themeNames[themeIdx];
      playSound('tap');
    }

    /* =========================================
       LOCAL STORAGE & RECORDS
    ========================================= */
    let bestScores = {
      car: parseInt(localStorage.getItem('shameel_car') || '0'),
      flappy: parseInt(localStorage.getItem('shameel_flappy') || '0'),
      knife: parseInt(localStorage.getItem('shameel_knife') || '1')
    };

    function refreshBestLabels() {
      document.getElementById('best-car').textContent = `Best Score: ${bestScores.car}`;
      document.getElementById('best-flappy').textContent = `Best Score: ${bestScores.flappy}`;
      document.getElementById('best-knife').textContent = `Best Stage: ${bestScores.knife}`;

      if (bestScores.car >= 30) {
        document.getElementById('badge-icon').textContent = '🏆';
        document.getElementById('badge-desc').textContent = 'Speed Demon അൺലോക്കായി! (30+ Completed)';
        document.getElementById('badge-desc').style.color = '#34d399';
      }
    }
    refreshBestLabels();

    /* =========================================
       5-SECOND WINNER OVERLAY
    ========================================= */
    let winModalTimer = null;
    function triggerWinModal(name, desc) {
      const modal = document.getElementById('winner-modal');
      document.getElementById('modal-name').textContent = name;
      document.getElementById('modal-desc').textContent = desc;
      modal.classList.remove('hidden');

      if (typeof confetti === 'function') {
        confetti({ particleCount: 110, spread: 80, origin: { y: 0.6 } });
      }

      const bar = document.querySelector('.modal-timer-fill');
      bar.style.animation = 'none';
      void bar.offsetWidth;
      bar.style.animation = 'timerBar 5s linear forwards';

      clearTimeout(winModalTimer);
      winModalTimer = setTimeout(() => {
        modal.classList.add('hidden');
      }, 5000);
    }

    /* =========================================
       NAVIGATION SYSTEM
    ========================================= */
    let activeGame = null;

    function startAppGame(game) {
      playSound('tap');
      document.getElementById('hub-screen').classList.add('hidden');
      document.getElementById('screen-car').classList.add('hidden');
      document.getElementById('screen-flappy').classList.add('hidden');
      document.getElementById('screen-knife').classList.add('hidden');

      activeGame = game;
      if (game === 'car') {
        document.getElementById('screen-car').classList.remove('hidden');
        initCarGame();
      } else if (game === 'flappy') {
        document.getElementById('screen-flappy').classList.remove('hidden');
        initFlappyGame();
      } else if (game === 'knife') {
        document.getElementById('screen-knife').classList.remove('hidden');
        initKnifeGame();
      }
    }

    function returnToHub() {
      playSound('tap');
      stopAllGameLoops();
      document.getElementById('screen-car').classList.add('hidden');
      document.getElementById('screen-flappy').classList.add('hidden');
      document.getElementById('screen-knife').classList.add('hidden');
      document.getElementById('hub-screen').classList.remove('hidden');
      refreshBestLabels();
    }

    function stopAllGameLoops() {
      cancelAnimationFrame(carAnimId);
      cancelAnimationFrame(flappyAnimId);
      cancelAnimationFrame(knifeAnimId);
    }

    /* =========================================
       1. TURBO CAR RACER GAME LOGIC
    ========================================= */
    const carCanvas = document.getElementById('car-canvas');
    const carCtx = carCanvas.getContext('2d');
    let carAnimId = null;
    let carLane = 1; // 0, 1, 2
    const lanesX = [55, 170, 285];
    let carScore = 0;
    let carSpeed = 4.5;
    let enemies = [];
    let coins = [];
    let roadStripeY = 0;
    let isCarOver = false;

    function initCarGame() {
      cancelAnimationFrame(carAnimId);
      carLane = 1;
      carScore = 0;
      carSpeed = 4.5;
      enemies = [];
      coins = [];
      isCarOver = false;
      document.getElementById('car-score').textContent = '0';
      loopCarGame();
    }

    function moveCarLane(dir) {
      if (isCarOver) return;
      carLane = Math.max(0, Math.min(2, carLane + dir));
      playSound('tap');
    }

    function triggerNitro() {
      if (isCarOver) return;
      carSpeed = 8.5;
      playSound('coin');
      setTimeout(() => { carSpeed = 4.5; }, 1400);
    }

    function loopCarGame() {
      carCtx.clearRect(0, 0, carCanvas.width, carCanvas.height);

      // Draw Highway Lanes
      carCtx.fillStyle = '#111827';
      carCtx.fillRect(0, 0, carCanvas.width, carCanvas.height);
      carCtx.strokeStyle = 'rgba(255,255,255,0.2)';
      carCtx.setLineDash([20, 15]);
      carCtx.lineDashOffset = -roadStripeY;
      roadStripeY = (roadStripeY + carSpeed) % 35;

      carCtx.beginPath();
      carCtx.moveTo(113, 0); carCtx.lineTo(113, carCanvas.height);
      carCtx.moveTo(226, 0); carCtx.lineTo(226, carCanvas.height);
      carCtx.stroke();

      // Spawn Enemies & Coins
      if (Math.random() < 0.022) {
        const lane = Math.floor(Math.random() * 3);
        enemies.push({ x: lanesX[lane], y: -50, lane: lane });
      }
      if (Math.random() < 0.018) {
        const lane = Math.floor(Math.random() * 3);
        coins.push({ x: lanesX[lane], y: -30 });
      }

      // Update & Draw Coins
      for (let i = coins.length - 1; i >= 0; i--) {
        const c = coins[i];
        c.y += carSpeed;
        carCtx.fillStyle = '#facc15';
        carCtx.beginPath();
        carCtx.arc(c.x, c.y, 10, 0, Math.PI * 2);
        carCtx.fill();

        // Collect
        if (Math.abs(c.x - lanesX[carLane]) < 25 && Math.abs(c.y - 350) < 30) {
          carScore += 5;
          playSound('coin');
          document.getElementById('car-score').textContent = carScore;
          coins.splice(i, 1);
        } else if (c.y > carCanvas.height + 20) {
          coins.splice(i, 1);
        }
      }

      // Update & Draw Enemies
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.y += carSpeed * 0.85;

        // Draw Enemy Car
        carCtx.fillStyle = '#ef4444';
        carCtx.fillRect(e.x - 18, e.y, 36, 52);
        carCtx.fillStyle = '#fee2e2';
        carCtx.fillRect(e.x - 14, e.y + 10, 28, 12);

        // Crash Detection
        if (Math.abs(e.x - lanesX[carLane]) < 28 && Math.abs(e.y - 350) < 45) {
          isCarOver = true;
          playSound('crash');
          if (carScore > bestScores.car) {
            bestScores.car = carScore;
            localStorage.setItem('shameel_car', carScore);
            triggerWinModal("NEW RECORD!", `Turbo Racer-ൽ ${carScore} സ്കോർ നേടി!`);
          }
          break;
        }

        if (e.y > carCanvas.height + 60) {
          enemies.splice(i, 1);
          carScore++;
          document.getElementById('car-score').textContent = carScore;
        }
      }

      // Draw Player Car
      const px = lanesX[carLane];
      carCtx.fillStyle = '#38bdf8';
      carCtx.fillRect(px - 18, 350, 36, 52);
      carCtx.fillStyle = '#0f172a';
      carCtx.fillRect(px - 14, 360, 28, 12);

      if (!isCarOver) {
        carAnimId = requestAnimationFrame(loopCarGame);
      } else {
        carCtx.fillStyle = 'rgba(0,0,0,0.7)';
        carCtx.fillRect(0, 0, carCanvas.width, carCanvas.height);
        carCtx.fillStyle = '#ef4444';
        carCtx.font = '900 28px Poppins';
        carCtx.textAlign = 'center';
        carCtx.fillText('CRASHED!', carCanvas.width / 2, 200);
        carCtx.fillStyle = '#fff';
        carCtx.font = '600 16px Poppins';
        carCtx.fillText('Tap Retry to Play Again', carCanvas.width / 2, 235);
      }
    }

    /* =========================================
       2. FLAPPY JET GAME LOGIC
    ========================================= */
    const flappyCanvas = document.getElementById('flappy-canvas');
    const flappyCtx = flappyCanvas.getContext('2d');
    let flappyAnimId = null;
    let jetY = 180;
    let jetVel = 0;
    let pipes = [];
    let flappyScore = 0;
    let isFlappyOver = false;

    function initFlappyGame() {
      cancelAnimationFrame(flappyAnimId);
      jetY = 180;
      jetVel = 0;
      pipes = [];
      flappyScore = 0;
      isFlappyOver = false;
      document.getElementById('flappy-score').textContent = '0';
      loopFlappyGame();
    }

    function flapJet() {
      if (isFlappyOver) {
        initFlappyGame();
        return;
      }
      jetVel = -5.2;
      playSound('tap');
    }

    function loopFlappyGame() {
      flappyCtx.clearRect(0, 0, flappyCanvas.width, flappyCanvas.height);

      jetVel += 0.28;
      jetY += jetVel;

      // Pipe Spawning
      if (pipes.length === 0 || pipes[pipes.length - 1].x < flappyCanvas.width - 150) {
        const topH = Math.floor(Math.random() * 160) + 40;
        pipes.push({ x: flappyCanvas.width, top: topH, passed: false });
      }

      // Draw & Check Pipes
      flappyCtx.fillStyle = '#22c55e';
      for (let i = pipes.length - 1; i >= 0; i--) {
        const p = pipes[i];
        p.x -= 2.2;

        // Top Pipe
        flappyCtx.fillRect(p.x, 0, 48, p.top);
        // Bottom Pipe
        const bottomY = p.top + 115;
        flappyCtx.fillRect(p.x, bottomY, 48, flappyCanvas.height - bottomY);

        // Score
        if (!p.passed && p.x + 48 < 60) {
          p.passed = true;
          flappyScore++;
          playSound('coin');
          document.getElementById('flappy-score').textContent = flappyScore;
        }

        // Collision
        if (60 + 16 > p.x && 60 - 16 < p.x + 48) {
          if (jetY - 14 < p.top || jetY + 14 > bottomY) {
            isFlappyOver = true;
          }
        }

        if (p.x < -60) pipes.splice(i, 1);
      }

      // Floor/Ceiling Hit
      if (jetY < 0 || jetY > flappyCanvas.height) isFlappyOver = true;

      // Draw Rocket Jet
      flappyCtx.fillStyle = '#38bdf8';
      flappyCtx.beginPath();
      flappyCtx.arc(60, jetY, 15, 0, Math.PI * 2);
      flappyCtx.fill();

      if (!isFlappyOver) {
        flappyAnimId = requestAnimationFrame(loopFlappyGame);
      } else {
        playSound('crash');
        if (flappyScore > bestScores.flappy) {
          bestScores.flappy = flappyScore;
          localStorage.setItem('shameel_flappy', flappyScore);
          triggerWinModal("FLAPPY CHAMP!", `Flappy Jet-ൽ ${flappyScore} സ്കോർ അടിച്ചു!`);
        }
        flappyCtx.fillStyle = 'rgba(0,0,0,0.7)';
        flappyCtx.fillRect(0, 0, flappyCanvas.width, flappyCanvas.height);
        flappyCtx.fillStyle = '#ef4444';
        flappyCtx.font = '900 28px Poppins';
        flappyCtx.textAlign = 'center';
        flappyCtx.fillText('GAME OVER', flappyCanvas.width / 2, 200);
        flappyCtx.fillStyle = '#fff';
        flappyCtx.font = '600 16px Poppins';
        flappyCtx.fillText('Tap to Fly Again', flappyCanvas.width / 2, 235);
      }
    }

    /* =========================================
       3. KNIFE HIT / DART MASTER LOGIC
    ========================================= */
    const knifeCanvas = document.getElementById('knife-canvas');
    const knifeCtx = knifeCanvas.getContext('2d');
    let knifeAnimId = null;
    let targetAngle = 0;
    let targetSpeed = 0.035;
    let knivesOnTarget = [];
    let knivesLeft = 6;
    let knifeStage = 1;
    let throwingKnife = null;
    let isKnifeOver = false;

    function initKnifeGame() {
      cancelAnimationFrame(knifeAnimId);
      targetAngle = 0;
      targetSpeed = 0.035 + (knifeStage * 0.005);
      knivesOnTarget = [];
      knivesLeft = 5 + knifeStage;
      throwingKnife = null;
      isKnifeOver = false;
      document.getElementById('knife-stage').textContent = knifeStage;
      document.getElementById('knife-count').textContent = knivesLeft;
      loopKnifeGame();
    }

    function throwKnife() {
      if (isKnifeOver || throwingKnife || knivesLeft <= 0) {
        if (isKnifeOver) { knifeStage = 1; initKnifeGame(); }
        return;
      }
      playSound('tap');
      throwingKnife = { y: 360 };
      knivesLeft--;
      document.getElementById('knife-count').textContent = knivesLeft;
    }

    function loopKnifeGame() {
      knifeCtx.clearRect(0, 0, knifeCanvas.width, knifeCanvas.height);
      const cx = knifeCanvas.width / 2;
      const cy = 130;
      const radius = 55;

      targetAngle += targetSpeed;

      // Draw Spinning Wood Target
      knifeCtx.save();
      knifeCtx.translate(cx, cy);
      knifeCtx.rotate(targetAngle);
      knifeCtx.fillStyle = '#92400e';
      knifeCtx.beginPath();
      knifeCtx.arc(0, 0, radius, 0, Math.PI * 2);
      knifeCtx.fill();
      knifeCtx.strokeStyle = '#b45309';
      knifeCtx.lineWidth = 4;
      knifeCtx.stroke();

      // Draw Embedded Knives
      for (let angle of knivesOnTarget) {
        knifeCtx.save();
        knifeCtx.rotate(angle);
        knifeCtx.fillStyle = '#94a3b8';
        knifeCtx.fillRect(-3, radius, 6, 38);
        knifeCtx.restore();
      }
      knifeCtx.restore();

      // Handle Throwing Knife
      if (throwingKnife) {
        throwingKnife.y -= 18;
        knifeCtx.fillStyle = '#f8fafc';
        knifeCtx.fillRect(cx - 3, throwingKnife.y, 6, 42);

        // Impact with Target
        if (throwingKnife.y <= cy + radius) {
          const hitAngle = Math.atan2(throwingKnife.y - cy, 0) - targetAngle;

          // Check if hits another knife
          let clashed = false;
          for (let a of knivesOnTarget) {
            let diff = Math.abs((a - hitAngle) % (Math.PI * 2));
            if (diff > Math.PI) diff = Math.PI * 2 - diff;
            if (diff < 0.22) { clashed = true; break; }
          }

          if (clashed) {
            isKnifeOver = true;
            playSound('crash');
          } else {
            playSound('coin');
            knivesOnTarget.push(hitAngle);
            throwingKnife = null;

            // Stage Cleared!
            if (knivesLeft === 0) {
              knifeStage++;
              if (knifeStage > bestScores.knife) {
                bestScores.knife = knifeStage;
                localStorage.setItem('shameel_knife', knifeStage);
              }
              triggerWinModal("STAGE CLEARED!", `Stage ${knifeStage - 1} പൂർത്തിയാക്കി! 🎯`);
              setTimeout(initKnifeGame, 1200);
              return;
            }
          }
        }
      } else if (knivesLeft > 0 && !isKnifeOver) {
        // Draw Ready Knife at Bottom
        knifeCtx.fillStyle = '#f8fafc';
        knifeCtx.fillRect(cx - 3, 350, 6, 42);
      }

      if (!isKnifeOver) {
        knifeAnimId = requestAnimationFrame(loopKnifeGame);
      } else {
        knifeCtx.fillStyle = 'rgba(0,0,0,0.7)';
        knifeCtx.fillRect(0, 0, knifeCanvas.width, knifeCanvas.height);
        knifeCtx.fillStyle = '#ef4444';
        knifeCtx.font = '900 28px Poppins';
        knifeCtx.textAlign = 'center';
        knifeCtx.fillText('KNIFE DEFLECTED!', knifeCanvas.width / 2, 230);
        knifeCtx.fillStyle = '#fff';
        knifeCtx.font = '600 16px Poppins';
        knifeCtx.fillText('Tap to Restart Stage', knifeCanvas.width / 2, 265);
      }
    }
  </script>
</body>

  <meta charset="UTF-8">

  <title>Shameel's Tic-Tac-Toe</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #020617;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 12px;
    }

    .hidden { display: none !important; }

    /* START CARD CONTAINER */
    #start-screen {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      animation: popIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }

    /* 3D POSTER IMAGE BOX */
    .poster-box {
      width: 100%;
      border-radius: 24px;
      overflow: hidden;
      border: 2px solid #38bdf840;
      box-shadow: 0 10px 30px rgba(56, 189, 248, 0.25);
      position: relative;
      background: #0b1120;
    }

    .poster-img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* CONTROLS CARD */
    .controls-card {
      width: 100%;
      background: rgba(15, 23, 42, 0.85);
      border: 1.5px solid rgba(56, 189, 248, 0.3);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    }

    .card-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: #94a3b8;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pill-group {
      background: #090d16;
      border-radius: 14px;
      padding: 4px;
      display: flex;
      gap: 6px;
      border: 1px solid #1e293b;
    }

    .pill-btn {
      flex: 1;
      padding: 11px 8px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: 11px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .pill-btn.active {
      background: linear-gradient(145deg, #0284c7, #0ea5e9);
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4);
    }

    /* 3D YELLOW START BUTTON */
    .btn-launch {
      width: 100%;
      padding: 15px 20px;
      background: linear-gradient(180deg, #fde047 0%, #eab308 50%, #ca8a04 100%);
      border: none;
      border-radius: 9999px;
      font-size: 1.2rem;
      font-weight: 900;
      color: #0f172a;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(234, 179, 8, 0.4), inset 0 2px 4px rgba(255,255,255,0.7);
      transition: all 0.15s ease;
      margin-top: 4px;
    }

    .btn-launch:active {
      transform: scale(0.97);
    }

    /* GAME PLAY SCREEN */
    #game-screen {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      animation: popIn 0.3s ease;
    }

    .game-top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    .scoreboard-box {
      width: 100%;
      display: flex;
      gap: 8px;
    }

    .score-card {
      flex: 1;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #334155;
      padding: 10px 4px;
      border-radius: 16px;
      text-align: center;
    }

    .score-title { font-size: 0.72rem; color: #94a3b8; font-weight: 600; }
    .score-val { font-size: 1.5rem; font-weight: 900; color: #38bdf8; }

    .game-status-bubble {
      background: #1e293b;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 8px 20px;
      border-radius: 9999px;
      font-weight: 700;
      color: #e2e8f0;
      font-size: 0.95rem;
    }

    .game-board {
      width: 100%;
      aspect-ratio: 1/1;
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid rgba(56, 189, 248, 0.3);
      border-radius: 26px;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    }

    .cell {
      background: #090d16;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: 900;
      cursor: pointer;
      border: 1px solid #1e293b;
      user-select: none;
      transition: all 0.15s ease;
    }

    .cell:active { transform: scale(0.94); }
    .cell.x { color: #38bdf8; text-shadow: 0 0 16px rgba(56, 189, 248, 0.8); }
    .cell.o { color: #ec4899; text-shadow: 0 0 16px rgba(236, 72, 153, 0.8); }
    .cell.win-cell { background: #1e3a5f; border-color: #38bdf8; animation: pulseWin 0.8s infinite alternate; }
    @keyframes pulseWin { from { transform: scale(0.98); } to { transform: scale(1.04); } }
  </style>
</head>
<body>

  <!-- START / WELCOME SCREEN -->
  <div id="start-screen">
    <!-- 3D Robotic Poster Card -->
    <div class="poster-box">
      <img src="file_0000000074188208aabdc190d10e5f39.png" class="poster-img" alt="Tic Tac Toe Poster" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800&auto=format&fit=crop&q=80';">
    </div>

    <!-- Controls Card -->
    <div class="controls-card">
      <div>
        <div class="card-label">🎮 മോഡ് തിരഞ്ഞെടുക്കുക</div>
        <div class="pill-group">
          <button class="pill-btn active" id="btn-mode-ai" onclick="selectMode('ai')">🤖 Unbeatable AI</button>
          <button class="pill-btn" id="btn-mode-2p" onclick="selectMode('2p')">👥 2 Players</button>
        </div>
      </div>

      <div id="sym-picker-area">
        <div class="card-label">👤 നിങ്ങളുടെ ചിഹ്നം</div>
        <div class="pill-group">
          <button class="pill-btn active" id="btn-sym-x" onclick="selectSymbol('X')">X (ആദ്യം)</button>
          <button class="pill-btn" id="btn-sym-o" onclick="selectSymbol('O')">O (രണ്ടാമത്)</button>
        </div>
      </div>

      <button class="btn-launch" onclick="launchGame()">
        <span>🚀</span> START GAME <span>➔</span>
      </button>
    </div>
  </div>

  <!-- GAME PLAY SCREEN -->
  <div id="game-screen" class="hidden">
    <div class="game-top-bar">
      <button class="nav-btn" onclick="goToHome()">⬅️ Back</button>
      <span id="label-game-mode" style="font-size:0.85rem; color:#38bdf8; font-weight:700;">Unbeatable AI</span>
      <button class="nav-btn" onclick="resetCurrentGame()">🔄 Restart</button>
    </div>

    <div class="scoreboard-box">
      <div class="score-card">
        <div class="score-title" id="p1-name">You (X)</div>
        <div class="score-val" id="val-score-p1">0</div>
      </div>
      <div class="score-card">
        <div class="score-title">Draw</div>
        <div class="score-val" id="val-score-draw">0</div>
      </div>
      <div class="score-card">
        <div class="score-title" id="p2-name">AI (O)</div>
        <div class="score-val" id="val-score-p2">0</div>
      </div>
    </div>

    <div class="game-status-bubble" id="game-status">നിങ്ങളുടെ ഊഴം (X)</div>

    <div class="game-board" id="board">
      <div class="cell" onclick="handleMove(0)"></div>
      <div class="cell" onclick="handleMove(1)"></div>
      <div class="cell" onclick="handleMove(2)"></div>
      <div class="cell" onclick="handleMove(3)"></div>
      <div class="cell" onclick="handleMove(4)"></div>
      <div class="cell" onclick="handleMove(5)"></div>
      <div class="cell" onclick="handleMove(6)"></div>
      <div class="cell" onclick="handleMove(7)"></div>
      <div class="cell" onclick="handleMove(8)"></div>
    </div>
  </div>

  <script>
    let mode = 'ai';
    let humanSymbol = 'X';
    let aiSymbol = 'O';
    let board = ["", "", "", "", "", "", "", "", ""];
    let currentTurn = "X";
    let isGamePlayable = true;
    let scores = { p1: 0, draw: 0, p2: 0 };

    const winCombos = [
      [0,1,2], [3,4,5], [6,7,8],
      [0,3,6], [1,4,7], [2,5,8],
      [0,4,8], [2,4,6]
    ];

    function selectMode(m) {
      mode = m;
      document.getElementById('btn-mode-ai').classList.toggle('active', m === 'ai');
      document.getElementById('btn-mode-2p').classList.toggle('active', m === '2p');
      document.getElementById('sym-picker-area').style.display = (m === 'ai') ? 'block' : 'none';
    }

    function selectSymbol(sym) {
      humanSymbol = sym;
      aiSymbol = (sym === 'X') ? 'O' : 'X';
      document.getElementById('btn-sym-x').classList.toggle('active', sym === 'X');
      document.getElementById('btn-sym-o').classList.toggle('active', sym === 'O');
    }

    function launchGame() {
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');

      if (mode === 'ai') {
        document.getElementById('label-game-mode').textContent = "Unbeatable AI";
        document.getElementById('p1-name').textContent = `You (${humanSymbol})`;
        document.getElementById('p2-name').textContent = `AI (${aiSymbol})`;
      } else {
        document.getElementById('label-game-mode').textContent = "2 Players";
        document.getElementById('p1-name').textContent = "Player (X)";
        document.getElementById('p2-name').textContent = "Player (O)";
      }

      resetCurrentGame();
    }

    function goToHome() {
      document.getElementById('game-screen').classList.add('hidden');
      document.getElementById('start-screen').classList.remove('hidden');
    }

    function handleMove(idx) {
      if (board[idx] !== "" || !isGamePlayable) return;

      playStep(idx, currentTurn);

      if (checkWin(board, currentTurn)) {
        finishGame(currentTurn);
        return;
      }

      if (board.every(cell => cell !== "")) {
        finishGame("draw");
        return;
      }

      if (mode === 'ai') {
        currentTurn = aiSymbol;
        isGamePlayable = false;
        document.getElementById('game-status').textContent = "AI ചിന്തിക്കുന്നു... 🤖";
        
        setTimeout(() => {
          const aiBest = getBestMove();
          playStep(aiBest, aiSymbol);

          if (checkWin(board, aiSymbol)) {
            finishGame(aiSymbol);
          } else if (board.every(c => c !== "")) {
            finishGame("draw");
          } else {
            currentTurn = humanSymbol;
            isGamePlayable = true;
            document.getElementById('game-status').textContent = `നിങ്ങളുടെ ഊഴം (${humanSymbol})`;
          }
        }, 400);
      } else {
        currentTurn = (currentTurn === "X") ? "O" : "X";
        document.getElementById('game-status').textContent = `പ്ലെയർ ${currentTurn}-ന്റെ ഊഴം`;
      }
    }

    function playStep(idx, player) {
      board[idx] = player;
      const el = document.getElementsByClassName('cell')[idx];
      el.textContent = player;
      el.classList.add(player.toLowerCase());
    }

    function checkWin(b, player) {
      return winCombos.some(combo => combo.every(i => b[i] === player));
    }

    function getWinPath(player) {
      return winCombos.find(combo => combo.every(i => board[i] === player));
    }

    function finishGame(winner) {
      isGamePlayable = false;
      if (winner === "draw") {
        document.getElementById('game-status').textContent = "കളി സമനിലയിൽ! 🤝";
        scores.draw++;
      } else {
        const path = getWinPath(winner);
        if (path) {
          path.forEach(i => document.getElementsByClassName('cell')[i].classList.add('win-cell'));
        }
        if (mode === 'ai') {
          document.getElementById('game-status').textContent = (winner === humanSymbol) ? "🎉 നിങ്ങൾ ജയിച്ചു!" : "🤖 AI ജയിച്ചു!";
          if (winner === humanSymbol) scores.p1++; else scores.p2++;
        } else {
          document.getElementById('game-status').textContent = `🎉 പ്ലെയർ ${winner} ജയിച്ചു!`;
          if (winner === "X") scores.p1++; else scores.p2++;
        }
      }
      refreshScores();
    }

    function refreshScores() {
      document.getElementById('val-score-p1').textContent = scores.p1;
      document.getElementById('val-score-draw').textContent = scores.draw;
      document.getElementById('val-score-p2').textContent = scores.p2;
    }

    function resetCurrentGame() {
      board = ["", "", "", "", "", "", "", "", ""];
      currentTurn = "X";
      isGamePlayable = true;
      const cells = document.getElementsByClassName('cell');
      for (let c of cells) {
        c.textContent = "";
        c.className = "cell";
      }

      if (mode === 'ai') {
        if (humanSymbol === 'O') {
          isGamePlayable = false;
          document.getElementById('game-status').textContent = "AI ചിന്തിക്കുന്നു... 🤖";
          setTimeout(() => {
            const initialCorners = [0, 2, 4, 6, 8];
            const move = initialCorners[Math.floor(Math.random() * initialCorners.length)];
            playStep(move, 'X');
            currentTurn = 'O';
            isGamePlayable = true;
            document.getElementById('game-status').textContent = "നിങ്ങളുടെ ഊഴം (O)";
          }, 350);
        } else {
          document.getElementById('game-status').textContent = "നിങ്ങളുടെ ഊഴം (X)";
        }
      } else {
        document.getElementById('game-status').textContent = "പ്ലെയർ X-ന്റെ ഊഴം";
      }
    }

    function getBestMove() {
      let bestScore = -Infinity;
      let move = -1;
      for (let i = 0; i < 9; i++) {
        if (board[i] === "") {
          board[i] = aiSymbol;
          let score = runMinimax(board, 0, false);
          board[i] = "";
          if (score > bestScore) {
            bestScore = score;
            move = i;
          }
        }
      }
      return move;
    }

      if (checkWin(b, aiSymbol)) return 10 - depth;

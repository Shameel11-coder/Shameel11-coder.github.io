<!DOCTYPE html>
<html lang="ml">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-N7Z24SXFBG"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-N7Z24SXFBG');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shameel's Game Zone</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #17153b 0%, #080811 70%, #030408 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      overflow-x: hidden;
    }

    .hidden { display: none !important; }

    /* =========================================
       FULLSCREEN 5-SECOND WINNER OVERLAY
    ========================================= */
    #winner-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(3, 7, 18, 0.94);
      backdrop-filter: blur(16px);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      animation: modalZoom 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes modalZoom {
      from { opacity: 0; transform: scale(0.75); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-trophy {
      font-size: 5.5rem;
      animation: bounceTrophy 1s infinite alternate ease-in-out;
      filter: drop-shadow(0 0 30px rgba(250, 204, 21, 0.6));
    }

    @keyframes bounceTrophy {
      from { transform: translateY(0) scale(1); }
      to { transform: translateY(-16px) scale(1.08); }
    }

    .modal-title {
      font-size: 2.5rem;
      font-weight: 900;
      margin-top: 10px;
      background: linear-gradient(135deg, #fde047, #f59e0b, #ef4444);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }

    .modal-winner-name {
      font-size: 1.5rem;
      font-weight: 800;
      color: #38bdf8;
      margin-top: 6px;
      text-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
    }

    .modal-subtitle {
      font-size: 0.95rem;
      color: #94a3b8;
      font-weight: 600;
      margin-top: 6px;
    }

    .modal-timer-bar {
      width: 160px;
      height: 6px;
      background: #1e293b;
      border-radius: 9999px;
      margin-top: 24px;
      overflow: hidden;
    }

    .modal-timer-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      animation: timerCountdown 5s linear forwards;
    }

    @keyframes timerCountdown {
      from { width: 100%; }
      to { width: 0%; }
    }

    /* =========================================
       1. ARCADE HOME HUB
    ========================================= */
    #hub-screen {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      animation: fadeIn 0.3s ease;
    }

    .hub-header {
      text-align: center;
      margin-bottom: 8px;
    }

    .hub-title {
      font-size: 2rem;
      font-weight: 900;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
    }

    .hub-subtitle {
      font-size: 0.85rem;
      color: #94a3b8;
      font-weight: 600;
    }

    .game-card-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .game-pick-card {
      width: 100%;
      background: rgba(15, 23, 42, 0.85);
      border: 1.5px solid rgba(56, 189, 248, 0.25);
      border-radius: 22px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      transition: all 0.15s ease;
      color: inherit;
      text-align: left;
    }

    .game-pick-card:active {
      transform: scale(0.97);
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
    }

    .game-pick-icon {
      font-size: 1.8rem;
      min-width: 58px;
      height: 58px;
      background: #090d16;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #1e293b;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      flex-shrink: 0;
      line-height: 1;
    }

    .game-pick-info { flex: 1; }
    .game-pick-title { font-size: 1.1rem; font-weight: 800; color: #f8fafc; }
    .game-pick-desc { font-size: 0.78rem; color: #94a3b8; margin-top: 2px; }
    .game-pick-arrow { font-size: 1.3rem; color: #38bdf8; font-weight: 900; }

    /* COMMON TOP NAVIGATION & PILLS */
    .top-hub-nav {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .btn-nav-home {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .mode-pill-bar {
      width: 100%;
      display: flex;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 4px;
      gap: 4px;
    }

    .mode-pill-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 8px 0;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-pill-btn.active {
      background: #0284c7;
      color: #ffffff;
      box-shadow: 0 2px 10px rgba(2, 132, 199, 0.4);
    }

    .scoreboard-box {
      width: 100%;
      display: flex;
      gap: 10px;
    }

    .score-card {
      flex: 1;
      background: #0f172a;
      border: 1px solid #1e293b;
      padding: 10px 4px;
      border-radius: 16px;
      text-align: center;
    }

    .score-title { font-size: 0.72rem; color: #94a3b8; font-weight: 600; }
    .score-val { font-size: 1.45rem; font-weight: 900; color: #38bdf8; margin-top: 2px; }

    .game-status-bubble {
      background: #0f172a;
      border: 1px solid #1e293b;
      padding: 8px 22px;
      border-radius: 9999px;
      font-weight: 700;
      color: #e2e8f0;
      font-size: 0.92rem;
      text-align: center;
    }

    /* =========================================
       2. TIC-TAC-TOE 3D POSTER & BOARD
    ========================================= */
    #start-screen {
      position: relative;
      width: 100%;
      max-width: 410px;
      border-radius: 26px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
      user-select: none;
    }

    .poster-img {
      width: 100%;
      height: auto;
      display: block;
      pointer-events: none;
      user-select: none;
    }

    .hotspot {
      position: absolute;
      cursor: pointer;
      border-radius: 14px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.001);
      border: 2px solid transparent;
      outline: none;
    }

    #hotspot-ai { top: 49.5%; left: 13%; width: 40%; height: 8.5%; }
    #hotspot-2p { top: 49.5%; left: 55%; width: 33%; height: 8.5%; }
    #hotspot-x { top: 63.8%; left: 13%; width: 39%; height: 8.5%; }
    #hotspot-o { top: 63.8%; left: 54%; width: 33%; height: 8.5%; }
    .hotspot.selected {
      border: 2px solid #38bdf8 !important;
      background: rgba(56, 189, 248, 0.12) !important;
    }

    #hotspot-start {
      top: 73.2%; left: 12%; width: 76%; height: 10%;
      border-radius: 9999px;
    }
    #hotspot-start:active {
      background: rgba(250, 204, 21, 0.3) !important;
      transform: scale(0.98);
    }

    #ttt-game-screen {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      animation: fadeIn 0.25s ease-out;
    }

    .board-wrapper {
      position: relative;
      width: 100%;
      height: 350px;
      max-height: 85vw;
    }

    .game-board {
      width: 100%;
      height: 100%;
      background: #0b1120;
      border: 1.5px solid #1e293b;
      border-radius: 24px;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .cell {
      background: #060a14;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: 900;
      cursor: pointer;
      border: 1px solid #172033;
      user-select: none;
      line-height: 1;
      overflow: hidden;
      transition: background 0.15s, transform 0.1s;
    }

    .cell:active { transform: scale(0.95); }
    .cell.x { color: #38bdf8; text-shadow: 0 0 14px rgba(56, 189, 248, 0.7); }
    .cell.o { color: #f43f5e; text-shadow: 0 0 14px rgba(244, 63, 94, 0.7); }
    .cell.win-cell { background: #0c2340; border-color: #38bdf8; }

    .strike-svg {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 20;
    }

    .strike-line {
      stroke: #38bdf8;
      stroke-width: 8;
      stroke-linecap: round;
      filter: drop-shadow(0 0 10px #38bdf8);
      stroke-dasharray: 400; stroke-dashoffset: 400;
      animation: drawStrike 0.4s ease-out forwards;
    }

    @keyframes drawStrike { to { stroke-dashoffset: 0; } }

    .btn-share {
      width: 100%;
      padding: 12px;
      background: #25D366;
      border: none;
      border-radius: 14px;
      color: #052e16;
      font-weight: 800;
      font-size: 0.92rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
      transition: transform 0.15s ease;
    }

    /* =========================================
       3. MEMORY CARD FLIP STYLES
    ========================================= */
    #memory-screen {
      width: 100%;
      max-width: 390px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      animation: fadeIn 0.25s ease;
    }

    .memory-grid {
      width: 100%;
      aspect-ratio: 1/1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 9px;
      background: #0b1120;
      padding: 12px;
      border-radius: 24px;
      border: 1.5px solid #1e293b;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .mem-card {
      background: #090d16;
      border: 1.5px solid #1e293b;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s ease, background 0.2s;
    }

    .mem-card.flipped {
      background: #1e293b;
      border-color: #38bdf8;
      transform: rotateY(180deg);
    }

    .mem-card.matched {
      background: #064e3b;
      border-color: #34d399;
      animation: pulseMatch 0.5s ease;
    }

    @keyframes pulseMatch {
      0% { transform: scale(0.9); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    /* =========================================
       4. ROCK PAPER SCISSORS STYLES
    ========================================= */
    #rps-screen {
      width: 100%;
      max-width: 390px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      animation: fadeIn 0.25s ease;
    }

    .rps-battlefield {
      width: 100%;
      background: #0b1120;
      border: 1.5px solid #1e293b;
      border-radius: 24px;
      padding: 18px 14px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .rps-fighter {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .rps-hand-display {
      width: 76px;
      height: 76px;
      background: #060a14;
      border: 2px solid #1e293b;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .rps-fighter-name { font-size: 0.85rem; font-weight: 700; color: #94a3b8; }

    .rps-actions {
      width: 100%;
      display: flex;
      gap: 10px;
    }

    .rps-btn {
      flex: 1;
      background: #0f172a;
      border: 1.5px solid #1e293b;
      border-radius: 18px;
      padding: 14px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .rps-btn:active {
      transform: scale(0.94);
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
    }

    .rps-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }

    .rps-btn-emoji { font-size: 2.2rem; }
    .rps-btn-label { font-size: 0.78rem; font-weight: 700; color: #e2e8f0; }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <!-- =========================================
       GLOBAL 5-SECOND FULLSCREEN WINNER POPUP
  ========================================= -->
  <div id="winner-modal" class="hidden">
    <div class="modal-trophy" id="modal-icon">🏆</div>
    <div class="modal-title" id="modal-headline">WINNER!</div>
    <div class="modal-winner-name" id="modal-player-name">Player Name</div>
    <div class="modal-subtitle" id="modal-subtext">അടിപൊളി വിജയം! 🎉</div>
    <div class="modal-timer-bar">
      <div class="modal-timer-fill"></div>
    </div>
  </div>

  <!-- =========================================
       1. ARCADE MAIN HUB SCREEN
  ========================================= -->
  <div id="hub-screen">
    <div class="hub-header">
      <div class="hub-title">SHAMEEL GAME ZONE 🎮</div>
      <div class="hub-subtitle">നിങ്ങൾക്ക് ഇഷ്ടമുള്ള ഗെയിം തിരഞ്ഞെടുക്കുക!</div>
    </div>

    <div class="game-card-list">
      <!-- 1. Tic Tac Toe Card -->
      <button type="button" class="game-pick-card" onclick="openGame('ttt-poster')">
        <div class="game-pick-icon">❌</div>
        <div class="game-pick-info">
          <div class="game-pick-title">Tic-Tac-Toe 3D</div>
          <div class="game-pick-desc">Unbeatable AI & 2 Player Mode</div>
        </div>
        <div class="game-pick-arrow">➔</div>
      </button>

      <!-- 2. Memory Card Flip Card -->
      <button type="button" class="game-pick-card" onclick="openGame('memory')">
        <div class="game-pick-icon">🧠</div>
        <div class="game-pick-info">
          <div class="game-pick-title">Memory Card Flip</div>
          <div class="game-pick-desc">vs Smart AI & 2 Player Match</div>
        </div>
        <div class="game-pick-arrow">➔</div>
      </button>

      <!-- 3. Rock Paper Scissors Card -->
      <button type="button" class="game-pick-card" onclick="openGame('rps')">
        <div class="game-pick-icon">✊</div>
        <div class="game-pick-info">
          <div class="game-pick-title">Rock Paper Scissors</div>
          <div class="game-pick-desc">First to 5 Points Challenge</div>
        </div>
        <div class="game-pick-arrow">➔</div>
      </button>
    </div>
  </div>

  <!-- =========================================
       2. TIC-TAC-TOE 3D POSTER & GAME SCREENS
  ========================================= -->
  <div id="start-screen" class="hidden">
    <div style="position: absolute; top: 12px; left: 12px; z-index: 25;">
      <button class="btn-nav-home" onclick="openGame('hub')">🏠 Arcade Home</button>
    </div>

    <img src="file_0000000074188208aabdc190d10e5f39.png" alt="3D Tic Tac Toe Poster" class="poster-img">

    <button type="button" id="hotspot-ai" class="hotspot selected" onclick="pickTttMode('ai')"></button>
    <button type="button" id="hotspot-2p" class="hotspot" onclick="pickTttMode('2p')"></button>
    <button type="button" id="hotspot-x" class="hotspot selected" onclick="pickTttSym('X')"></button>
    <button type="button" id="hotspot-o" class="hotspot" onclick="pickTttSym('O')"></button>
    <button type="button" id="hotspot-start" class="hotspot" onclick="launchTttGame()"></button>
  </div>

  <div id="ttt-game-screen" class="hidden">
    <div class="top-hub-nav">
      <button class="btn-nav-home" onclick="openGame('ttt-poster')">⬅️ Settings</button>
      <span id="label-game-mode" style="font-size:0.85rem; color:#38bdf8; font-weight:700;">Smart AI</span>
      <button class="btn-nav-home" onclick="openGame('hub')">🏠 Home</button>
    </div>

    <div class="mode-pill-bar" id="ttt-diff-bar">
      <button class="mode-pill-btn" id="diff-easy" onclick="setTttDifficulty('easy')">Easy 🟢</button>
      <button class="mode-pill-btn" id="diff-med" onclick="setTttDifficulty('medium')">Medium 🟡</button>
      <button class="mode-pill-btn active" id="diff-hard" onclick="setTttDifficulty('hard')">Impossible 🔴</button>
    </div>

    <div class="scoreboard-box">
      <div class="score-card">
        <div class="score-title" id="ttt-p1-name">You (X)</div>
        <div class="score-val" id="ttt-val-p1">0</div>
      </div>
      <div class="score-card">
        <div class="score-title">Draw</div>
        <div class="score-val" id="ttt-val-draw">0</div>
      </div>
      <div class="score-card">
        <div class="score-title" id="ttt-p2-name">AI (O)</div>
        <div class="score-val" id="ttt-val-p2">0</div>
      </div>
    </div>

    <div class="game-status-bubble" id="ttt-game-status">നിങ്ങളുടെ ഊഴം (X)</div>

    <div class="board-wrapper">
      <div class="game-board" id="ttt-board">
        <div class="cell" onclick="handleTttMove(0)"></div>
        <div class="cell" onclick="handleTttMove(1)"></div>
        <div class="cell" onclick="handleTttMove(2)"></div>
        <div class="cell" onclick="handleTttMove(3)"></div>
        <div class="cell" onclick="handleTttMove(4)"></div>
        <div class="cell" onclick="handleTttMove(5)"></div>
        <div class="cell" onclick="handleTttMove(6)"></div>
        <div class="cell" onclick="handleTttMove(7)"></div>
        <div class="cell" onclick="handleTttMove(8)"></div>
      </div>
      <svg class="strike-svg" id="strike-svg"></svg>
    </div>

    <button class="btn-share" onclick="shareToWhatsApp()">
      WhatsApp-ൽ ചലഞ്ച് ഷെയർ ചെയ്യുക
    </button>
  </div>

  <!-- =========================================
       3. MEMORY CARD FLIP SCREEN
  ========================================= -->
  <div id="memory-screen" class="hidden">
    <div class="top-hub-nav">
      <button class="btn-nav-home" onclick="openGame('hub')">🏠 Home</button>
      <button class="btn-nav-home" onclick="initMemoryGame()">🔄 Restart</button>
    </div>

    <div class="mode-pill-bar">
      <button class="mode-pill-btn active" id="btn-mem-ai" onclick="setMemMode('ai')">🤖 vs AI</button>
      <button class="mode-pill-btn" id="btn-mem-2p" onclick="setMemMode('2p')">👥 2 Players</button>
    </div>

    <div class="scoreboard-box">
      <div class="score-card">
        <div class="score-title" id="mem-p1-label">You</div>
        <div class="score-val" id="mem-p1-score">0</div>
      </div>
      <div class="score-card">
        <div class="score-title">Moves</div>
        <div class="score-val" id="mem-moves" style="color:#94a3b8;">0</div>
      </div>
      <div class="score-card">
        <div class="score-title" id="mem-p2-label">AI</div>
        <div class="score-val" id="mem-p2-score" style="color:#f43f5e;">0</div>
      </div>
    </div>

    <div class="game-status-bubble" id="mem-status">നിങ്ങളുടെ ഊഴം! കാർഡ് തുറക്കൂ 🧠</div>

    <div class="memory-grid" id="mem-grid"></div>
  </div>

  <!-- =========================================
       4. ROCK PAPER SCISSORS SCREEN
  ========================================= -->
  <div id="rps-screen" class="hidden">
    <div class="top-hub-nav">
      <button class="btn-nav-home" onclick="openGame('hub')">🏠 Home</button>
      <button class="btn-nav-home" onclick="resetRpsScores()">🔄 Reset</button>
    </div>

    <div class="mode-pill-bar">
      <button class="mode-pill-btn active" id="btn-rps-ai" onclick="setRpsMode('ai')">🤖 vs AI</button>
      <button class="mode-pill-btn" id="btn-rps-2p" onclick="setRpsMode('2p')">👥 2 Players</button>
    </div>

    <div class="scoreboard-box">
      <div class="score-card">
        <div class="score-title" id="rps-p1-label">You</div>
        <div class="score-val" id="rps-p1-score">0 / 5</div>
      </div>
      <div class="score-card">
        <div class="score-title">Draw</div>
        <div class="score-val" id="rps-draw-score">0</div>
      </div>
      <div class="score-card">
        <div class="score-title" id="rps-p2-label">AI</div>
        <div class="score-val" id="rps-p2-score" style="color:#f43f5e;">0 / 5</div>
      </div>
    </div>

    <div class="game-status-bubble" id="rps-status">ആദ്യം 5 പോയിന്റ് നേടുന്നയാൾ ജയിക്കും! 🏆</div>

    <div class="rps-battlefield">
      <div class="rps-fighter">
        <div class="rps-hand-display" id="rps-player-hand">❓</div>
        <div class="rps-fighter-name" id="rps-fighter1-name">You</div>
      </div>
      <div style="font-weight:900; font-size:1.5rem; color:#38bdf8;">VS</div>
      <div class="rps-fighter">
        <div class="rps-hand-display" id="rps-ai-hand">❓</div>
        <div class="rps-fighter-name" id="rps-fighter2-name">AI</div>
      </div>
    </div>

    <div class="rps-actions">
      <button class="rps-btn" id="rps-btn-rock" onclick="handleRpsChoice('rock')">
        <span class="rps-btn-emoji">✊</span>
        <span class="rps-btn-label">Rock</span>
      </button>
      <button class="rps-btn" id="rps-btn-paper" onclick="handleRpsChoice('paper')">
        <span class="rps-btn-emoji">✋</span>
        <span class="rps-btn-label">Paper</span>
      </button>
      <button class="rps-btn" id="rps-btn-scissors" onclick="handleRpsChoice('scissors')">
        <span class="rps-btn-emoji">✌️</span>
        <span class="rps-btn-label">Scissors</span>
      </button>
    </div>
  </div>

  <script>
    /* =========================================
       GLOBAL 5-SECOND FULLSCREEN WINNER POPUP LOGIC
    ========================================= */
    let modalTimer = null;

    function showFullscreenWinner(winnerName, subtext = "അടിപൊളി വിജയം! 🎉", icon = "🏆") {
      const modal = document.getElementById('winner-modal');
      document.getElementById('modal-icon').textContent = icon;
      document.getElementById('modal-player-name').textContent = winnerName;
      document.getElementById('modal-subtext').textContent = subtext;

      modal.classList.remove('hidden');

      // Trigger Confetti Blast
      triggerConfetti();

      // Reset and re-trigger timer bar animation
      const bar = document.querySelector('.modal-timer-fill');
      bar.style.animation = 'none';
      void bar.offsetWidth; // Trigger reflow
      bar.style.animation = 'timerCountdown 5s linear forwards';

      clearTimeout(modalTimer);
      modalTimer = setTimeout(() => {
        modal.classList.add('hidden');
      }, 5000);
    }

    function triggerConfetti() {
      if (typeof confetti === 'function') {
        confetti({ particleCount: 120, spread: 85, origin: { y: 0.6 } });
      }
    }

    /* =========================================
       NAVIGATION LOGIC
    ========================================= */
    function openGame(screenId) {
      document.getElementById('hub-screen').classList.add('hidden');
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('ttt-game-screen').classList.add('hidden');
      document.getElementById('memory-screen').classList.add('hidden');
      document.getElementById('rps-screen').classList.add('hidden');

      if (screenId === 'hub') {
        document.getElementById('hub-screen').classList.remove('hidden');
      } else if (screenId === 'ttt-poster') {
        document.getElementById('start-screen').classList.remove('hidden');
      } else if (screenId === 'memory') {
        document.getElementById('memory-screen').classList.remove('hidden');
        initMemoryGame();
      } else if (screenId === 'rps') {
        document.getElementById('rps-screen').classList.remove('hidden');
        resetRpsScores();
      }
    }

    /* =========================================
       1. TIC TAC TOE LOGIC
    ========================================= */
    let tttMode = 'ai';
    let tttDifficulty = 'hard';
    let tttHumanSymbol = 'X';
    let tttAiSymbol = 'O';
    let tttBoard = ["", "", "", "", "", "", "", "", ""];
    let tttCurrentTurn = "X";
    let tttIsPlayable = true;
    let tttScores = { p1: 0, draw: 0, p2: 0 };
    let tttRestartTimer = null;

    const tttWinCombos = [
      { combo: [0,1,2], type: 'row', idx: 0 },
      { combo: [3,4,5], type: 'row', idx: 1 },
      { combo: [6,7,8], type: 'row', idx: 2 },
      { combo: [0,3,6], type: 'col', idx: 0 },
      { combo: [1,4,7], type: 'col', idx: 1 },
      { combo: [2,5,8], type: 'col', idx: 2 },
      { combo: [0,4,8], type: 'diag', idx: 0 },
      { combo: [2,4,6], type: 'diag', idx: 1 }
    ];

    function pickTttMode(m) {
      tttMode = m;
      document.getElementById('hotspot-ai').classList.toggle('selected', m === 'ai');
      document.getElementById('hotspot-2p').classList.toggle('selected', m === '2p');
    }

    function pickTttSym(s) {
      tttHumanSymbol = s;
      tttAiSymbol = (s === 'X') ? 'O' : 'X';
      document.getElementById('hotspot-x').classList.toggle('selected', s === 'X');
      document.getElementById('hotspot-o').classList.toggle('selected', s === 'O');
    }

    function setTttDifficulty(lvl) {
      tttDifficulty = lvl;
      document.getElementById('diff-easy').classList.toggle('active', lvl === 'easy');
      document.getElementById('diff-med').classList.toggle('active', lvl === 'medium');
      document.getElementById('diff-hard').classList.toggle('active', lvl === 'hard');
      resetTttGame();
    }

    function launchTttGame() {
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('ttt-game-screen').classList.remove('hidden');

      if (tttMode === 'ai') {
        document.getElementById('label-game-mode').textContent = "Smart AI";
        document.getElementById('ttt-p1-name').textContent = `You (${tttHumanSymbol})`;
        document.getElementById('ttt-p2-name').textContent = `AI (${tttAiSymbol})`;
        document.getElementById('ttt-diff-bar').classList.remove('hidden');
      } else {
        document.getElementById('label-game-mode').textContent = "2 Players";
        document.getElementById('ttt-p1-name').textContent = "Player (X)";
        document.getElementById('ttt-p2-name').textContent = "Player (O)";
        document.getElementById('ttt-diff-bar').classList.add('hidden');
      }
      resetTttGame();
    }

    function handleTttMove(idx) {
      if (tttBoard[idx] !== "" || !tttIsPlayable) return;

      playTttStep(idx, tttCurrentTurn);

      const winResult = checkTttWin(tttBoard, tttCurrentTurn);
      if (winResult) {
        finishTttGame(tttCurrentTurn, winResult);
        return;
      }

      if (tttBoard.every(cell => cell !== "")) {
        finishTttGame("draw", null);
        return;
      }

      if (tttMode === 'ai') {
        tttCurrentTurn = tttAiSymbol;
        tttIsPlayable = false;
        document.getElementById('ttt-game-status').textContent = "AI ചിന്തിക്കുന്നു... 🤖";
        
        setTimeout(() => {
          const aiMove = getTttAIMove();
          playTttStep(aiMove, tttAiSymbol);

          const aiWin = checkTttWin(tttBoard, tttAiSymbol);
          if (aiWin) {
            finishTttGame(tttAiSymbol, aiWin);
          } else if (tttBoard.every(c => c !== "")) {
            finishTttGame("draw", null);
          } else {
            tttCurrentTurn = tttHumanSymbol;
            tttIsPlayable = true;
            document.getElementById('ttt-game-status').textContent = `നിങ്ങളുടെ ഊഴം (${tttHumanSymbol})`;
          }
        }, 350);
      } else {
        tttCurrentTurn = (tttCurrentTurn === "X") ? "O" : "X";
        document.getElementById('ttt-game-status').textContent = `പ്ലെയർ ${tttCurrentTurn}-ന്റെ ഊഴം`;
      }
    }

    function playTttStep(idx, player) {
      tttBoard[idx] = player;
      const el = document.getElementsByClassName('cell')[idx];
      el.textContent = player;
      el.classList.add(player.toLowerCase());
    }

    function checkTttWin(b, player) {
      return tttWinCombos.find(item => item.combo.every(i => b[i] === player));
    }

    function drawTttStrike(winInfo, winner) {
      const svg = document.getElementById('strike-svg');
      svg.innerHTML = '';
      const strokeColor = (winner === 'X') ? '#38bdf8' : '#f43f5e';
      let x1, y1, x2, y2;
      const w = svg.clientWidth || 350;
      const h = svg.clientHeight || 350;

      if (winInfo.type === 'row') {
        const yPos = (winInfo.idx === 0) ? h * 0.19 : (winInfo.idx === 1) ? h * 0.5 : h * 0.81;
        x1 = w * 0.08; y1 = yPos;
        x2 = w * 0.92; y2 = yPos;
      } else if (winInfo.type === 'col') {
        const xPos = (winInfo.idx === 0) ? w * 0.19 : (winInfo.idx === 1) ? w * 0.5 : w * 0.81;
        x1 = xPos; y1 = h * 0.08;
        x2 = xPos; y2 = h * 0.92;
      } else if (winInfo.type === 'diag') {
        if (winInfo.idx === 0) { x1 = w * 0.1; y1 = h * 0.1; x2 = w * 0.9; y2 = h * 0.9; }
        else { x1 = w * 0.9; y1 = h * 0.1; x2 = w * 0.1; y2 = h * 0.9; }
      }

      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', x1); line.setAttribute('y1', y1);
      line.setAttribute('x2', x2); line.setAttribute('y2', y2);
      line.setAttribute('class', 'strike-line');
      line.style.stroke = strokeColor;
      line.style.filter = `drop-shadow(0 0 12px ${strokeColor})`;
      svg.appendChild(line);
    }

    function finishTttGame(winner, winResult) {
      tttIsPlayable = false;
      if (winner === "draw") {
        document.getElementById('ttt-game-status').textContent = "കളി സമനിലയിൽ! 🤝";
        tttScores.draw++;
      } else {
        if (winResult) {
          winResult.combo.forEach(i => document.getElementsByClassName('cell')[i].classList.add('win-cell'));
          drawTttStrike(winResult, winner);
        }
        if (tttMode === 'ai') {
          if (winner === tttHumanSymbol) {
            document.getElementById('ttt-game-status').textContent = "🎉 നിങ്ങൾ ജയിച്ചു!";
            tttScores.p1++;
            showFullscreenWinner("YOU WON!", "നിങ്ങൾ AI-യെ പരാജയപ്പെടുത്തി!");
          } else {
            document.getElementById('ttt-game-status').textContent = "🤖 AI ജയിച്ചു!";
            tttScores.p2++;
            showFullscreenWinner("SMART AI WON!", "AI ഈ റൗണ്ട് വിജയിച്ചു!", "🤖");
          }
        } else {
          document.getElementById('ttt-game-status').textContent = `🎉 പ്ലെയർ ${winner} ജയിച്ചു!`;
          if (winner === "X") tttScores.p1++; else tttScores.p2++;
          showFullscreenWinner(`PLAYER ${winner} WON!`, `പ്ലെയർ ${winner} ഈ റൗണ്ട് നേടി!`);
        }
      }
      document.getElementById('ttt-val-p1').textContent = tttScores.p1;
      document.getElementById('ttt-val-draw').textContent = tttScores.draw;
      document.getElementById('ttt-val-p2').textContent = tttScores.p2;

      clearTimeout(tttRestartTimer);
      tttRestartTimer = setTimeout(() => { resetTttGame(); }, 5000);
    }

    function resetTttGame() {
      tttBoard = ["", "", "", "", "", "", "", "", ""];
      tttCurrentTurn = "X";
      tttIsPlayable = true;
      document.getElementById('strike-svg').innerHTML = '';
      const cells = document.getElementsByClassName('cell');
      for (let c of cells) { c.textContent = ""; c.className = "cell"; }

      if (tttMode === 'ai') {
        if (tttHumanSymbol === 'O') {
          tttIsPlayable = false;
          document.getElementById('ttt-game-status').textContent = "AI ചിന്തിക്കുന്നു... 🤖";
          setTimeout(() => {
            playTttStep(4, 'X');
            tttCurrentTurn = 'O';
            tttIsPlayable = true;
            document.getElementById('ttt-game-status').textContent = "നിങ്ങളുടെ ഊഴം (O)";
          }, 350);
        } else {
          document.getElementById('ttt-game-status').textContent = "നിങ്ങളുടെ ഊഴം (X)";
        }
      } else {
        document.getElementById('ttt-game-status').textContent = "പ്ലെയർ X-ന്റെ ഊഴം";
      }
    }

    function getTttAIMove() {
      const emptyIndices = tttBoard.map((val, idx) => val === "" ? idx : null).filter(val => val !== null);
      if (tttDifficulty === 'easy') return emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
      if (tttDifficulty === 'medium' && Math.random() > 0.5) return emptyIndices[Math.floor(Math.random() * emptyIndices.length)];

      let bestScore = -Infinity;
      let move = -1;
      for (let i of emptyIndices) {
        tttBoard[i] = tttAiSymbol;
        let score = runTttMinimax(tttBoard, 0, false);
        tttBoard[i] = "";
        if (score > bestScore) { bestScore = score; move = i; }
      }
      return move;
    }

    function runTttMinimax(b, depth, isMaximizing) {
      if (checkTttWin(b, tttAiSymbol)) return 10 - depth;
      if (checkTttWin(b, tttHumanSymbol)) return depth - 10;
      if (b.every(c => c !== "")) return 0;

      if (isMaximizing) {
        let maxVal = -Infinity;
        for (let i = 0; i < 9; i++) {
          if (b[i] === "") {
            b[i] = tttAiSymbol;
            maxVal = Math.max(maxVal, runTttMinimax(b, depth + 1, false));
            b[i] = "";
          }
        }
        return maxVal;
      } else {
        let minVal = Infinity;
        for (let i = 0; i < 9; i++) {
          if (b[i] === "") {
            b[i] = tttHumanSymbol;
            minVal = Math.min(minVal, runTttMinimax(b, depth + 1, true));
            b[i] = "";
          }
        }
        return minVal;
      }
    }

    function shareToWhatsApp() {
      const siteUrl = "https://shameel11-coder.github.io";
      const message = `🔥 ഞാൻ Shameel-ന്റെ Tic-Tac-Toe ഗെയിമിൽ സ്കോർ അടിച്ചു തൂക്കി!\n\n🎮 നിലവിലെ സ്കോർ:\n👉 You: ${tttScores.p1} | AI: ${tttScores.p2} | Draw: ${tttScores.draw}\n\nധൈര്യമുണ്ടെങ്കിൽ ഈ Unbeatable AI-യെ തോൽപ്പിച്ചു കാണിക്ക്!\n🔗 ${siteUrl}`;
      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(message)}`, '_blank');
    }

    /* =========================================
       2. MEMORY CARD GAME (AI + 2 PLAYERS)
    ========================================= */
    const memIcons = ['🚀', '⚽', '💎', '🎮', '🔥', '👑', '🍕', '🤖'];
    let memMode = 'ai';
    let memCards = [];
    let memFlippedCards = [];
    let memMoves = 0;
    let memScores = { p1: 0, p2: 0 };
    let memTurn = 1;
    let lockMemBoard = false;
    let aiMemory = {};

    function setMemMode(mode) {
      memMode = mode;
      document.getElementById('btn-mem-ai').classList.toggle('active', mode === 'ai');
      document.getElementById('btn-mem-2p').classList.toggle('active', mode === '2p');
      document.getElementById('mem-p1-label').textContent = (mode === 'ai') ? 'You' : 'Player 1';
      document.getElementById('mem-p2-label').textContent = (mode === 'ai') ? 'AI' : 'Player 2';
      initMemoryGame();
    }

    function initMemoryGame() {
      const grid = document.getElementById('mem-grid');
      grid.innerHTML = '';
      memCards = [...memIcons, ...memIcons].sort(() => 0.5 - Math.random());
      memFlippedCards = [];
      memMoves = 0;
      memScores = { p1: 0, p2: 0 };
      memTurn = 1;
      lockMemBoard = false;
      aiMemory = {};

      document.getElementById('mem-moves').textContent = '0';
      document.getElementById('mem-p1-score').textContent = '0';
      document.getElementById('mem-p2-score').textContent = '0';
      updateMemStatus();

      memCards.forEach((icon, index) => {
        const card = document.createElement('div');
        card.classList.add('mem-card');
        card.dataset.index = index;
        card.dataset.icon = icon;
        card.textContent = '❓';
        card.onclick = () => {
          if (memMode === 'ai' && memTurn === 2) return;
          flipMemCard(card);
        };
        grid.appendChild(card);
      });
    }

    function updateMemStatus() {
      if (memMode === 'ai') {
        document.getElementById('mem-status').textContent = (memTurn === 1) ? "നിങ്ങളുടെ ഊഴം! കാർഡ് തുറക്കൂ 🧠" : "AI ചിന്തിക്കുന്നു... 🤖";
      } else {
        document.getElementById('mem-status').textContent = `പ്ലെയർ ${memTurn}-ന്റെ ഊഴം! 🧠`;
      }
    }

    function flipMemCard(card) {
      if (lockMemBoard || card.classList.contains('flipped') || card.classList.contains('matched')) return;

      card.classList.add('flipped');
      card.textContent = card.dataset.icon;
      memFlippedCards.push(card);

      aiMemory[card.dataset.index] = card.dataset.icon;

      if (memFlippedCards.length === 2) {
        memMoves++;
        document.getElementById('mem-moves').textContent = memMoves;
        checkMemMatch();
      }
    }

    function checkMemMatch() {
      const [c1, c2] = memFlippedCards;
      if (c1.dataset.icon === c2.dataset.icon) {
        c1.classList.add('matched');
        c2.classList.add('matched');
        delete aiMemory[c1.dataset.index];
        delete aiMemory[c2.dataset.index];

        if (memTurn === 1) memScores.p1++; else memScores.p2++;
        document.getElementById('mem-p1-score').textContent = memScores.p1;
        document.getElementById('mem-p2-score').textContent = memScores.p2;
        memFlippedCards = [];

        // Check if all pairs are matched
        if (memScores.p1 + memScores.p2 === 8) {
          if (memScores.p1 > memScores.p2) {
            const winner = (memMode === 'ai') ? "YOU WON!" : "PLAYER 1 WON!";
            document.getElementById('mem-status').textContent = `🎉 ${winner}`;
            showFullscreenWinner(winner, "എല്ലാ കാർഡുകളും വിജയകരമായി കണ്ടെത്തി! 🧠");
          } else if (memScores.p2 > memScores.p1) {
            const winner = (memMode === 'ai') ? "AI WON!" : "PLAYER 2 WON!";
            document.getElementById('mem-status').textContent = `🤖 ${winner}`;
            showFullscreenWinner(winner, "കൂടുതൽ ജോടികൾ ഉണ്ടാക്കി വിജയിച്ചു!", (memMode === 'ai') ? "🤖" : "🏆");
          } else {
            document.getElementById('mem-status').textContent = "സമനിലയായി! 🤝";
          }
          setTimeout(initMemoryGame, 5000);
          return;
        }

        if (memMode === 'ai' && memTurn === 2) {
          setTimeout(runMemAITurn, 800);
        }
      } else {
        lockMemBoard = true;
        setTimeout(() => {
          c1.classList.remove('flipped');
          c2.classList.remove('flipped');
          c1.textContent = '❓';
          c2.textContent = '❓';
          memFlippedCards = [];
          lockMemBoard = false;

          memTurn = (memTurn === 1) ? 2 : 1;
          updateMemStatus();

          if (memMode === 'ai' && memTurn === 2) {
            setTimeout(runMemAITurn, 700);
          }
        }, 900);
      }
    }

    function runMemAITurn() {
      if (memScores.p1 + memScores.p2 === 8) return;

      const unmatchedCards = Array.from(document.querySelectorAll('.mem-card:not(.matched)'));
      let firstCard = null;
      let secondCard = null;

      const iconToIndices = {};
      for (const [idx, icon] of Object.entries(aiMemory)) {
        if (!iconToIndices[icon]) iconToIndices[icon] = [];
        iconToIndices[icon].push(idx);
      }

      for (const icon in iconToIndices) {
        if (iconToIndices[icon].length >= 2) {
          const [i1, i2] = iconToIndices[icon];
          firstCard = document.querySelector(`.mem-card[data-index='${i1}']`);
          secondCard = document.querySelector(`.mem-card[data-index='${i2}']`);
          break;
        }
      }

      if (!firstCard || !secondCard) {
        const available = unmatchedCards.filter(c => !c.classList.contains('flipped'));
        firstCard = available[Math.floor(Math.random() * available.length)];
        
        for (const [idx, icon] of Object.entries(aiMemory)) {
          if (idx !== firstCard.dataset.index && icon === firstCard.dataset.icon) {
            secondCard = document.querySelector(`.mem-card[data-index='${idx}']`);
            break;
          }
        }
        if (!secondCard) {
          const remaining = available.filter(c => c !== firstCard);
          secondCard = remaining[Math.floor(Math.random() * remaining.length)];
        }
      }

      if (firstCard && secondCard) {
        flipMemCard(firstCard);
        setTimeout(() => {
          flipMemCard(secondCard);
        }, 600);
      }
    }

    /* =========================================
       3. ROCK PAPER SCISSORS (FIRST TO 5 WINS STRICT)
    ========================================= */
    const rpsEmojis = { rock: '✊', paper: '✋', scissors: '✌️' };
    let rpsMode = 'ai';
    let rpsScores = { p1: 0, draw: 0, p2: 0 };
    let rpsP1Choice = null;
    let rpsMatchOver = false;

    function setRpsMode(mode) {
      rpsMode = mode;
      document.getElementById('btn-rps-ai').classList.toggle('active', mode === 'ai');
      document.getElementById('btn-rps-2p').classList.toggle('active', mode === '2p');
      document.getElementById('rps-p1-label').textContent = (mode === 'ai') ? 'You' : 'Player 1';
      document.getElementById('rps-p2-label').textContent = (mode === 'ai') ? 'AI' : 'Player 2';
      document.getElementById('rps-fighter1-name').textContent = (mode === 'ai') ? 'You' : 'Player 1';
      document.getElementById('rps-fighter2-name').textContent = (mode === 'ai') ? 'AI' : 'Player 2';
      resetRpsScores();
    }

    function toggleRpsButtons(enable) {
      document.getElementById('rps-btn-rock').disabled = !enable;
      document.getElementById('rps-btn-paper').disabled = !enable;
      document.getElementById('rps-btn-scissors').disabled = !enable;
    }

    function handleRpsChoice(choice) {
      if (rpsMatchOver) return;

      if (rpsMode === 'ai') {
        const choices = ['rock', 'paper', 'scissors'];
        const aiChoice = choices[Math.floor(Math.random() * choices.length)];
        evaluateRpsRound(choice, aiChoice);
      } else {
        if (!rpsP1Choice) {
          rpsP1Choice = choice;
          document.getElementById('rps-player-hand').textContent = '🔒';
          document.getElementById('rps-status').textContent = "Player 1 തിരഞ്ഞെടുത്തു! ഇനി Player 2 ആയുധം തിരഞ്ഞെടുക്കൂ 👇";
        } else {
          const p2Choice = choice;
          evaluateRpsRound(rpsP1Choice, p2Choice);
          rpsP1Choice = null;
        }
      }
    }

    function evaluateRpsRound(c1, c2) {
      document.getElementById('rps-player-hand').textContent = rpsEmojis[c1];
      document.getElementById('rps-ai-hand').textContent = rpsEmojis[c2];

      if (c1 === c2) {
        document.getElementById('rps-status').textContent = "റൗണ്ട് സമനില! 🤝";
        rpsScores.draw++;
      } else if (
        (c1 === 'rock' && c2 === 'scissors') ||
        (c1 === 'paper' && c2 === 'rock') ||
        (c1 === 'scissors' && c2 === 'paper')
      ) {
        rpsScores.p1++;
        document.getElementById('rps-status').textContent = (rpsMode === 'ai') ? "റൗണ്ട് നിങ്ങൾ നേടി! 🎯" : "റൗണ്ട് Player 1 നേടി! 🎯";
      } else {
        rpsScores.p2++;
        document.getElementById('rps-status').textContent = (rpsMode === 'ai') ? "റൗണ്ട് AI നേടി! 🤖" : "റൗണ്ട് Player 2 നേടി! 🎯";
      }

      document.getElementById('rps-p1-score').textContent = `${rpsScores.p1} / 5`;
      document.getElementById('rps-draw-score').textContent = rpsScores.draw;
      document.getElementById('rps-p2-score').textContent = `${rpsScores.p2} / 5`;

      // 5 POINTS REACHED CHECK
      if (rpsScores.p1 >= 5 || rpsScores.p2 >= 5) {
        rpsMatchOver = true;
        toggleRpsButtons(false);

        const isP1 = rpsScores.p1 >= 5;
        const winnerHeadline = isP1 
          ? ((rpsMode === 'ai') ? "YOU WON!" : "PLAYER 1 WON!")
          : ((rpsMode === 'ai') ? "AI WON!" : "PLAYER 2 WON!");

        const icon = (!isP1 && rpsMode === 'ai') ? "🤖" : "🏆";
        showFullscreenWinner(winnerHeadline, "ആദ്യം 5 പോയിന്റ് നേടി മാച്ച് വിജയിച്ചു!", icon);

        setTimeout(() => {
          resetRpsScores();
          toggleRpsButtons(true);
        }, 5000);
      }
    }

    function resetRpsScores() {
      rpsScores = { p1: 0, draw: 0, p2: 0 };
      rpsP1Choice = null;
      rpsMatchOver = false;
      toggleRpsButtons(true);
      document.getElementById('rps-p1-score').textContent = '0 / 5';
      document.getElementById('rps-draw-score').textContent = '0';
      document.getElementById('rps-p2-score').textContent = '0 / 5';
      document.getElementById('rps-player-hand').textContent = '❓';
      document.getElementById('rps-ai-hand').textContent = '❓';
      document.getElementById('rps-status').textContent = 'ആദ്യം 5 പോയിന്റ് നേടുന്നയാൾ ജയിക്കും! 🏆';
    }
  </script>
</body>
</html>

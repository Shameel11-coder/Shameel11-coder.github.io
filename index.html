<!DOCTYPE html>
<html lang="ml">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shameel's Tic-Tac-Toe</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      background: #060913;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      overflow-x: hidden;
    }

    .hidden { display: none !important; }

    /* START SCREEN POSTER */
    #start-screen {
      position: relative;
      width: 100%;
      max-width: 410px;
      border-radius: 26px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
      user-select: none;
    }

    .poster-img {
      width: 100%;
      height: auto;
      display: block;
      pointer-events: none;
      user-select: none;
    }

    /* INVISIBLE HOTSPOTS */
    .hotspot {
      position: absolute;
      cursor: pointer;
      border-radius: 14px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.001);
      border: 2px solid transparent;
      outline: none;
    }

    #hotspot-ai {
      top: 49.5%;
      left: 13%;
      width: 40%;
      height: 8.5%;
    }

    #hotspot-2p {
      top: 49.5%;
      left: 55%;
      width: 33%;
      height: 8.5%;
    }

    #hotspot-x {
      top: 63.8%;
      left: 13%;
      width: 39%;
      height: 8.5%;
    }

    #hotspot-o {
      top: 63.8%;
      left: 54%;
      width: 33%;
      height: 8.5%;
    }

    .hotspot.selected {
      border: 2px solid #38bdf8 !important;
      background: rgba(56, 189, 248, 0.12) !important;
    }

    #hotspot-start {
      top: 73.2%;
      left: 12%;
      width: 76%;
      height: 10%;
      border-radius: 9999px;
    }

    #hotspot-start:active {
      background: rgba(250, 204, 21, 0.3) !important;
      transform: scale(0.98);
    }

    /* GAME SCREEN */
    #game-screen {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      animation: fadeIn 0.25s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .game-top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-btn {
      background: #111827;
      border: 1px solid #1f2937;
      color: #94a3b8;
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* DIFFICULTY SELECTOR PILL */
    .diff-selector {
      width: 100%;
      display: flex;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 4px;
      gap: 4px;
    }

    .diff-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 7px 0;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .diff-btn.active {
      background: #0284c7;
      color: #ffffff;
      box-shadow: 0 2px 10px rgba(2, 132, 199, 0.4);
    }

    .scoreboard-box {
      width: 100%;
      display: flex;
      gap: 10px;
    }

    .score-card {
      flex: 1;
      background: #0f172a;
      border: 1px solid #1e293b;
      padding: 10px 4px;
      border-radius: 16px;
      text-align: center;
    }

    .score-title { font-size: 0.72rem; color: #94a3b8; font-weight: 600; }
    .score-val { font-size: 1.45rem; font-weight: 900; color: #38bdf8; margin-top: 2px; }

    .game-status-bubble {
      background: #0f172a;
      border: 1px solid #1e293b;
      padding: 8px 22px;
      border-radius: 9999px;
      font-weight: 700;
      color: #e2e8f0;
      font-size: 0.92rem;
    }

    /* BOARD CONTAINER WITH RELATIVE POSITION FOR SVG STRIKE LINE */
    .board-wrapper {
      position: relative;
      width: 100%;
      height: 350px;
      max-height: 85vw;
    }

    .game-board {
      width: 100%;
      height: 100%;
      background: #0b1120;
      border: 1.5px solid #1e293b;
      border-radius: 24px;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .cell {
      background: #060a14;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: 900;
      cursor: pointer;
      border: 1px solid #172033;
      user-select: none;
      line-height: 1;
      overflow: hidden;
      transition: background 0.15s, transform 0.1s;
    }

    .cell:active { transform: scale(0.95); }
    .cell.x {
      color: #38bdf8;
      text-shadow: 0 0 14px rgba(56, 189, 248, 0.7);
    }
    .cell.o {
      color: #f43f5e;
      text-shadow: 0 0 14px rgba(244, 63, 94, 0.7);
    }

    .cell.win-cell {
      background: #0c2340;
      border-color: #38bdf8;
    }

    /* WINNING STRIKE-THROUGH SVG LINE OVERLAY */
    .strike-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 20;
    }

    .strike-line {
      stroke: #38bdf8;
      stroke-width: 8;
      stroke-linecap: round;
      filter: drop-shadow(0 0 10px #38bdf8);
      stroke-dasharray: 400;
      stroke-dashoffset: 400;
      animation: drawStrike 0.4s ease-out forwards;
    }

    @keyframes drawStrike {
      to { stroke-dashoffset: 0; }
    }

    /* WHATSAPP SHARE BUTTON */
    .btn-share {
      width: 100%;
      padding: 12px;
      background: #25D366;
      border: none;
      border-radius: 14px;
      color: #052e16;
      font-weight: 800;
      font-size: 0.92rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
      transition: transform 0.15s ease;
    }

    .btn-share:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>

  <!-- FULL 3D POSTER START SCREEN -->
  <div id="start-screen">
    <img src="file_0000000074188208aabdc190d10e5f39.png" alt="3D Tic Tac Toe Poster" class="poster-img">

    <!-- Mode Hotspots -->
    <button type="button" id="hotspot-ai" class="hotspot selected" onclick="pickMode('ai')"></button>
    <button type="button" id="hotspot-2p" class="hotspot" onclick="pickMode('2p')"></button>

    <!-- Symbol Hotspots -->
    <button type="button" id="hotspot-x" class="hotspot selected" onclick="pickSym('X')"></button>
    <button type="button" id="hotspot-o" class="hotspot" onclick="pickSym('O')"></button>

    <!-- Start Button Hotspot -->
    <button type="button" id="hotspot-start" class="hotspot" onclick="launchGame()"></button>
  </div>

  <!-- GAME SCREEN -->
  <div id="game-screen" class="hidden">
    <div class="game-top-bar">
      <button class="nav-btn" onclick="goToHome()">⬅️ Back</button>
      <span id="label-game-mode" style="font-size:0.85rem; color:#38bdf8; font-weight:700;">Smart AI</span>
      <button class="nav-btn" onclick="manualRestart()">🔄 Restart</button>
    </div>

    <!-- AI Difficulty Toggle -->
    <div class="diff-selector" id="diff-bar">
      <button class="diff-btn" id="diff-easy" onclick="setDifficulty('easy')">Easy 🟢</button>
      <button class="diff-btn" id="diff-med" onclick="setDifficulty('medium')">Medium 🟡</button>
      <button class="diff-btn active" id="diff-hard" onclick="setDifficulty('hard')">Impossible 🔴</button>
    </div>

    <div class="scoreboard-box">
      <div class="score-card">
        <div class="score-title" id="p1-name">You (X)</div>
        <div class="score-val" id="val-score-p1">0</div>
      </div>
      <div class="score-card">
        <div class="score-title">Draw</div>
        <div class="score-val" id="val-score-draw">0</div>
      </div>
      <div class="score-card">
        <div class="score-title" id="p2-name">AI (O)</div>
        <div class="score-val" id="val-score-p2">0</div>
      </div>
    </div>

    <div class="game-status-bubble" id="game-status">Ningalude oozham (X)</div>

    <!-- Board Wrapper with Strike Line SVG -->
    <div class="board-wrapper">
      <div class="game-board" id="board">
        <div class="cell" onclick="handleMove(0)"></div>
        <div class="cell" onclick="handleMove(1)"></div>
        <div class="cell" onclick="handleMove(2)"></div>
        <div class="cell" onclick="handleMove(3)"></div>
        <div class="cell" onclick="handleMove(4)"></div>
        <div class="cell" onclick="handleMove(5)"></div>
        <div class="cell" onclick="handleMove(6)"></div>
        <div class="cell" onclick="handleMove(7)"></div>
        <div class="cell" onclick="handleMove(8)"></div>
      </div>

      <svg class="strike-svg" id="strike-svg"></svg>
    </div>

    <!-- WhatsApp Share Button -->
    <button class="btn-share" onclick="shareToWhatsApp()">
      <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
        <path d="M12.031 2c-5.514 0-9.999 4.486-9.999 10 0 1.761.459 3.479 1.332 5.006l-1.364 4.994 5.12-1.343c1.472.805 3.125 1.343 4.911 1.343 5.514 0 10-4.486 10-10s-4.486-10-10-10zm0 18.25c-1.579 0-3.109-.434-4.444-1.258l-.319-.196-3.3 0.865.88-3.218-.21-.334c-.908-1.442-1.387-3.119-1.387-4.859 0-4.549 3.701-8.25 8.25-8.25s8.25 3.701 8.25 8.25-3.701 8.25-8.25 8.25zm4.524-6.195c-.248-.124-1.467-.724-1.695-.807-.228-.083-.394-.124-.56.124-.166.248-.644.807-.789.973-.145.166-.29.186-.538.062-.248-.124-1.047-.386-1.995-1.231-.738-.658-1.237-1.471-1.382-1.719-.145-.248-.016-.382.108-.505.111-.11.248-.29.373-.435.124-.145.166-.248.248-.415.083-.166.041-.311-.021-.435-.062-.124-.56-1.349-.767-1.848-.202-.486-.407-.42-.56-.428l-.477-.008c-.166 0-.435.062-.663.311-.228.248-.871.851-.871 2.075s.892 2.406 1.016 2.572c.124.166 1.755 2.68 4.252 3.757.594.256 1.058.409 1.42.524.597.19 1.14.163 1.57.099.479-.071 1.467-.6 1.674-1.18.207-.58.207-1.077.145-1.18-.062-.104-.228-.166-.476-.29z"/>
      </svg>
      WhatsApp-ൽ ചലഞ്ച് ഷെയർ ചെയ്യുക
    </button>
  </div>

  <script>
    let mode = 'ai';
    let difficulty = 'hard';
    let humanSymbol = 'X';
    let aiSymbol = 'O';
    let board = ["", "", "", "", "", "", "", "", ""];
    let currentTurn = "X";
    let isGamePlayable = true;
    let scores = { p1: 0, draw: 0, p2: 0 };
    let restartTimer = null;

    const winCombos = [
      { combo: [0,1,2], type: 'row', idx: 0 },
      { combo: [3,4,5], type: 'row', idx: 1 },
      { combo: [6,7,8], type: 'row', idx: 2 },
      { combo: [0,3,6], type: 'col', idx: 0 },
      { combo: [1,4,7], type: 'col', idx: 1 },
      { combo: [2,5,8], type: 'col', idx: 2 },
      { combo: [0,4,8], type: 'diag', idx: 0 },
      { combo: [2,4,6], type: 'diag', idx: 1 }
    ];

    function pickMode(m) {
      mode = m;
      document.getElementById('hotspot-ai').classList.toggle('selected', m === 'ai');
      document.getElementById('hotspot-2p').classList.toggle('selected', m === '2p');
    }

    function pickSym(s) {
      humanSymbol = s;
      aiSymbol = (s === 'X') ? 'O' : 'X';
      document.getElementById('hotspot-x').classList.toggle('selected', s === 'X');
      document.getElementById('hotspot-o').classList.toggle('selected', s === 'O');
    }

    function setDifficulty(lvl) {
      difficulty = lvl;
      document.getElementById('diff-easy').classList.toggle('active', lvl === 'easy');
      document.getElementById('diff-med').classList.toggle('active', lvl === 'medium');
      document.getElementById('diff-hard').classList.toggle('active', lvl === 'hard');
      manualRestart();
    }

    function launchGame() {
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');

      if (mode === 'ai') {
        document.getElementById('label-game-mode').textContent = "Smart AI";
        document.getElementById('p1-name').textContent = `You (${humanSymbol})`;
        document.getElementById('p2-name').textContent = `AI (${aiSymbol})`;
        document.getElementById('diff-bar').classList.remove('hidden');
      } else {
        document.getElementById('label-game-mode').textContent = "2 Players";
        document.getElementById('p1-name').textContent = "Player (X)";
        document.getElementById('p2-name').textContent = "Player (O)";
        document.getElementById('diff-bar').classList.add('hidden');
      }

      manualRestart();
    }

    function goToHome() {
      clearTimeout(restartTimer);
      document.getElementById('game-screen').classList.add('hidden');
      document.getElementById('start-screen').classList.remove('hidden');
    }

    function handleMove(idx) {
      if (board[idx] !== "" || !isGamePlayable) return;

      playStep(idx, currentTurn);

      const winResult = checkWin(board, currentTurn);
      if (winResult) {
        finishGame(currentTurn, winResult);
        return;
      }

      if (board.every(cell => cell !== "")) {
        finishGame("draw", null);
        return;
      }

      if (mode === 'ai') {
        currentTurn = aiSymbol;
        isGamePlayable = false;
        document.getElementById('game-status').textContent = "AI ചിന്തിക്കുന്നു... 🤖";
        
        setTimeout(() => {
          const aiMove = getAIMove();
          playStep(aiMove, aiSymbol);

          const aiWin = checkWin(board, aiSymbol);
          if (aiWin) {
            finishGame(aiSymbol, aiWin);
          } else if (board.every(c => c !== "")) {
            finishGame("draw", null);
          } else {
            currentTurn = humanSymbol;
            isGamePlayable = true;
            document.getElementById('game-status').textContent = `നിങ്ങളുടെ ഊഴം (${humanSymbol})`;
          }
        }, 350);
      } else {
        currentTurn = (currentTurn === "X") ? "O" : "X";
        document.getElementById('game-status').textContent = `പ്ലെയർ ${currentTurn}-ന്റെ ഊഴം`;
      }
    }

    function playStep(idx, player) {
      board[idx] = player;
      const el = document.getElementsByClassName('cell')[idx];
      el.textContent = player;
      el.classList.add(player.toLowerCase());
    }

    function checkWin(b, player) {
      return winCombos.find(item => item.combo.every(i => b[i] === player));
    }

    function drawStrikeLine(winInfo, winner) {
      const svg = document.getElementById('strike-svg');
      svg.innerHTML = '';
      const strokeColor = (winner === 'X') ? '#38bdf8' : '#f43f5e';

      let x1, y1, x2, y2;
      const w = svg.clientWidth || 350;
      const h = svg.clientHeight || 350;

      if (winInfo.type === 'row') {
        const yPos = (winInfo.idx === 0) ? h * 0.19 : (winInfo.idx === 1) ? h * 0.5 : h * 0.81;
        x1 = w * 0.08; y1 = yPos;
        x2 = w * 0.92; y2 = yPos;
      } else if (winInfo.type === 'col') {
        const xPos = (winInfo.idx === 0) ? w * 0.19 : (winInfo.idx === 1) ? w * 0.5 : w * 0.81;
        x1 = xPos; y1 = h * 0.08;
        x2 = xPos; y2 = h * 0.92;
      } else if (winInfo.type === 'diag') {
        if (winInfo.idx === 0) {
          x1 = w * 0.1; y1 = h * 0.1;
          x2 = w * 0.9; y2 = h * 0.9;
        } else {
          x1 = w * 0.9; y1 = h * 0.1;
          x2 = w * 0.1; y2 = h * 0.9;
        }
      }

      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', x1);
      line.setAttribute('y1', y1);
      line.setAttribute('x2', x2);
      line.setAttribute('y2', y2);
      line.setAttribute('class', 'strike-line');
      line.style.stroke = strokeColor;
      line.style.filter = `drop-shadow(0 0 12px ${strokeColor})`;
      svg.appendChild(line);
    }

    function triggerConfetti() {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 90,
          spread: 75,
          origin: { y: 0.6 }
        });
      }
    }

    function finishGame(winner, winResult) {
      isGamePlayable = false;
      if (winner === "draw") {
        document.getElementById('game-status').textContent = "കളി സമനിലയിൽ! 🤝";
        scores.draw++;
      } else {
        if (winResult) {
          winResult.combo.forEach(i => document.getElementsByClassName('cell')[i].classList.add('win-cell'));
          drawStrikeLine(winResult, winner);
        }
        if (mode === 'ai') {
          if (winner === humanSymbol) {
            document.getElementById('game-status').textContent = "🎉 നിങ്ങൾ ജയിച്ചു!";
            scores.p1++;
            triggerConfetti();
          } else {
            document.getElementById('game-status').textContent = "🤖 AI ജയിച്ചു!";
            scores.p2++;
          }
        } else {
          document.getElementById('game-status').textContent = `🎉 പ്ലെയർ ${winner} ജയിച്ചു!`;
          if (winner === "X") scores.p1++; else scores.p2++;
          triggerConfetti();
        }
      }
      refreshScores();

      // AUTO-RESTART AFTER 1.8 SECONDS
      clearTimeout(restartTimer);
      restartTimer = setTimeout(() => {
        resetCurrentGame();
      }, 1800);
    }

    function refreshScores() {
      document.getElementById('val-score-p1').textContent = scores.p1;
      document.getElementById('val-score-draw').textContent = scores.draw;
      document.getElementById('val-score-p2').textContent = scores.p2;
    }

    function manualRestart() {
      clearTimeout(restartTimer);
      resetCurrentGame();
    }

    function resetCurrentGame() {
      board = ["", "", "", "", "", "", "", "", ""];
      currentTurn = "X";
      isGamePlayable = true;
      document.getElementById('strike-svg').innerHTML = '';
      const cells = document.getElementsByClassName('cell');
      for (let c of cells) {
        c.textContent = "";
        c.className = "cell";
      }

      if (mode === 'ai') {
        if (humanSymbol === 'O') {
          isGamePlayable = false;
          document.getElementById('game-status').textContent = "AI ചിന്തിക്കുന്നു... 🤖";
          setTimeout(() => {
            const initialCorners = [0, 2, 4, 6, 8];
            const move = initialCorners[Math.floor(Math.random() * initialCorners.length)];
            playStep(move, 'X');
            currentTurn = 'O';
            isGamePlayable = true;
            document.getElementById('game-status').textContent = "നിങ്ങളുടെ ഊഴം (O)";
          }, 350);
        } else {
          document.getElementById('game-status').textContent = "നിങ്ങളുടെ ഊഴം (X)";
        }
      } else {
        document.getElementById('game-status').textContent = "പ്ലെയർ X-ന്റെ ഊഴം";
      }
    }

    // AI MOVE LOGIC
    function getAIMove() {
      const emptyIndices = board.map((val, idx) => val === "" ? idx : null).filter(val => val !== null);

      if (difficulty === 'easy') {
        return emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
      }

      if (difficulty === 'medium') {
        if (Math.random() > 0.5) {
          return emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
        }
      }

      let bestScore = -Infinity;
      let move = -1;
      for (let i of emptyIndices) {
        board

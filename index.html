    * {

    body {

      align-items: center;
      justify-content: center;
      padding: 8px;

      width: 100%;

      border-radius: 28px;
      overflow: hidden;

    }

    @keyframes popIn {

    .poster-img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* DIRECT ON-IMAGE CLICKABLE HOTSPOTS */
    .hotspot {
      position: absolute;
      cursor: pointer;
      border-radius: 14px;
      transition: background 0.15s ease, box-shadow 0.15s ease;
      background: transparent;
      border: 2px solid transparent;
    }

    /* Mode: Unbeatable AI */
    #hotspot-ai {
      top: 50.2%;
      left: 14.5%;
      width: 38%;
      height: 7.2%;
    }

    /* Mode: 2 Players */

      top: 50.2%;
      left: 54%;
      width: 32%;
      height: 7.2%;
    }

    /* Symbol: X */

      top: 64.6%;
      left: 14.5%;
      width: 36%;
      height: 7.2%;
    }

    /* Symbol: O */
    #hotspot-o {
      top: 64.6%;
      left: 52%;
      width: 34%;
      height: 7.2%;
    }

    /* Active Glowing State over selected option */
    .hotspot.selected {
      border: 2px solid #38bdf8;
      background: rgba(56, 189, 248, 0.22);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
    }

    /* Start Button Hotspot */
    #hotspot-start {
      top: 74.2%;
      left: 13.5%;
      width: 73%;
      height: 8.5%;
      border-radius: 9999px;
    }

    #hotspot-start:active {
      background: rgba(250, 204, 21, 0.35);
      box-shadow: 0 0 20px rgba(250, 204, 21, 0.6);
    }

    /* GAME PLAY SCREEN */
    #game-screen {
      width: 100%;
      max-width: 390px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;

    .game-top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    .scoreboard-box {
      width: 100%;
      display: flex;
      gap: 8px;
    }

    .score-card {
      flex: 1;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #334155;
      padding: 10px 4px;
      border-radius: 16px;
      text-align: center;
    }

    .score-title { font-size: 0.72rem; color: #94a3b8; font-weight: 600; }

    .game-status-bubble {
      background: #1e293b;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 8px 20px;
      border-radius: 9999px;
      font-weight: 700;
      color: #e2e8f0;
      font-size: 0.92rem;
    }

    .game-board {
      width: 100%;
      aspect-ratio: 1/1;
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid rgba(56, 189, 248, 0.3);
      border-radius: 24px;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    }

    .cell {
      background: #090d16;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: 900;
      cursor: pointer;
      border: 1px solid #1e293b;
      user-select: none;
      transition: all 0.15s ease;
    }

    .cell:active { transform: scale(0.94); }
    .cell.x { color: #38bdf8; text-shadow: 0 0 16px rgba(56, 189, 248, 0.8); }
    .cell.o { color: #ec4899; text-shadow: 0 0 16px rgba(236, 72, 153, 0.8); }
    .cell.win-cell { background: #1e3a5f; border-color: #38bdf8; animation: pulseWin 0.8s infinite alternate; }
    @keyframes pulseWin { from { transform: scale(0.98); } to { transform: scale(1.04); } }
  </style>

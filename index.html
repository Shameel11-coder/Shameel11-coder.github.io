  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #030712;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    .hidden { display: none !important; }

    /* POSTER WRAPPER */
    #start-screen {
      width: 100vw;
      max-width: 430px;
      height: 100vh;
      max-height: 932px;
      position: relative;
      background: url('file_0000000074188208aabdc190d10e5f39.png') no-repeat center center;
      background-size: cover;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 40px rgba(0,0,0,0.8);
    }

    /* INVISIBLE / GLOWING CLICKABLE OVERLAYS MATCHING THE IMAGE */
    .overlay-controls {
      position: absolute;
      bottom: 7%;
      left: 7.5%;
      right: 7.5%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .touch-row {
      display: flex;
      height: 48px;
      gap: 10px;
    }

    .touch-btn {
      flex: 1;
      border: none;
      background: rgba(2, 132, 199, 0.01);
      cursor: pointer;
      border-radius: 14px;
      transition: all 0.2s ease;
    }

    .touch-btn.active {
      border: 2px solid #38bdf8;
      background: rgba(56, 189, 248, 0.25);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
    }

<!DOCTYPE html>
<html lang="ml">
<head>
  <!-- Google tag (gtag.js) -->

    gtag('config', 'G-N7Z24SXFBG');

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shameel's Tic-Tac-Toe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    h1 {
      font-size: 2rem;
      color: #38bdf8;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }
    .mode-toggle {
      display: flex;
      background: #1e293b;
      border-radius: 9999px;
      padding: 4px;
      width: 100%;
      border: 1px solid #334155;
    }
    .mode-btn {
      flex: 1;
      padding: 8px 12px;
      border: none;
      background: transparent;
      color: #94a3b8;
      border-radius: 9999px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }
    .mode-btn.active {
      background: #38bdf8;
      color: #0f172a;
    }
    .scoreboard {
      display: flex;
      justify-content: space-between;
      width: 100%;
      gap: 8px;
    }
    .score-card {
      background: #1e293b;
      flex: 1;
      padding: 10px 8px;
      border-radius: 12px;
      text-align: center;
      border: 1px solid #334155;
    }
    .score-title { font-size: 0.75rem; color: #94a3b8; }
    .score-value { font-size: 1.4rem; font-weight: bold; margin-top: 4px; color: #38bdf8; }
    .status {
      font-size: 1.1rem;
      font-weight: 600;
      color: #f1f5f9;
      min-height: 28px;
      text-align: center;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #1e293b;
      padding: 12px;
      border-radius: 16px;
      border: 1px solid #334155;
    }
    .cell {
      background: #0f172a;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s, transform 0.1s;
    }
    .cell:active { transform: scale(0.96); }
    .cell.x { color: #38bdf8; }
    .cell.o { color: #f43f5e; }
    .cell.win {
      background: #1e3a5f;
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.04); }
    }
    .controls {
      display: flex;
      gap: 10px;
      width: 100%;
    }
    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-reset {
      background: #38bdf8;
      color: #0f172a;
    }
    .btn-clear {
      background: #334155;
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Tic-Tac-Toe</h1>
    
    <div class="mode-toggle">
      <button class="mode-btn active" id="btn-ai" onclick="setMode('ai')">Smart AI</button>
      <button class="mode-btn" id="btn-2p" onclick="setMode('2p')">2 Players</button>
    </div>

    <div class="scoreboard">
      <div class="score-card">
        <div class="score-title" id="p1-label">Player (X)</div>
        <div class="score-value" id="score-p1">0</div>
      </div>
      <div class="score-card">
        <div class="score-title">Draw</div>
        <div class="score-value" id="score-draw">0</div>
      </div>
      <div class="score-card">
        <div class="score-title" id="p2-label">AI (O)</div>
        <div class="score-value" id="score-p2">0</div>
      </div>
    </div>

    <div class="status" id="status">നിങ്ങളുടെ ഊഴം (X)</div>

    <div class="board" id="board">
      <div class="cell" onclick="handleCellClick(0)"></div>
      <div class="cell" onclick="handleCellClick(1)"></div>
      <div class="cell" onclick="handleCellClick(2)"></div>
      <div class="cell" onclick="handleCellClick(3)"></div>
      <div class="cell" onclick="handleCellClick(4)"></div>
      <div class="cell" onclick="handleCellClick(5)"></div>
      <div class="cell" onclick="handleCellClick(6)"></div>
      <div class="cell" onclick="handleCellClick(7)"></div>
      <div class="cell" onclick="handleCellClick(8)"></div>
    </div>

    <div class="controls">
      <button class="btn btn-reset" onclick="resetBoard()">Restart</button>
      <button class="btn btn-clear" onclick="clearScores()">Reset Score</button>
    </div>
  </div>

  <script>
    let mode = 'ai';
    let board = ["", "", "", "", "", "", "", "", ""];
    let currentPlayer = "X";
    let gameActive = true;
    let scores = { p1: 0, draw: 0, p2: 0 };

    const winConditions = [
      [0,1,2], [3,4,5], [6,7,8],
      [0,3,6], [1,4,7], [2,5,8],
      [0,4,8], [2,4,6]
    ];

    function setMode(newMode) {
      mode = newMode;
      document.getElementById('btn-ai').classList.toggle('active', mode === 'ai');
      document.getElementById('btn-2p').classList.toggle('active', mode === '2p');
      document.getElementById('p2-label').textContent = (mode === 'ai') ? 'AI (O)' : 'Player (O)';
      resetBoard();
    }

    function handleCellClick(index) {
      if (board[index] !== "" || !gameActive) return;

      makeMove(index, currentPlayer);

      if (checkWin(board, currentPlayer)) {
        endGame(currentPlayer);
        return;
      }

      if (board.every(cell => cell !== "")) {
        endGame("draw");
        return;
      }

      if (mode === 'ai') {
        currentPlayer = "O";
        gameActive = false;
        document.getElementById('status').textContent = "AI ചിന്തിക്കുന്നു...";
        setTimeout(() => {
          const bestMove = getBestMove();
          makeMove(bestMove, "O");
          if (checkWin(board, "O")) {
            endGame("O");
          } else if (board.every(cell => cell !== "")) {
            endGame("draw");
          } else {
            currentPlayer = "X";
            gameActive = true;
            document.getElementById('status').textContent = "നിങ്ങളുടെ ഊഴം (X)";
          }
        }, 400);
      } else {
        currentPlayer = (currentPlayer === "X") ? "O" : "X";
        document.getElementById('status').textContent = `പ്ലെയർ ${currentPlayer}-ന്റെ ഊഴം`;
      }
    }

    function makeMove(index, player) {
      board[index] = player;
      const cell = document.getElementsByClassName('cell')[index];
      cell.textContent = player;
      cell.classList.add(player.toLowerCase());
    }

    function checkWin(currentBoard, player) {
      return winConditions.some(condition => condition.every(index => currentBoard[index] === player));
    }

    function getWinningLine(player) {
      return winConditions.find(condition => condition.every(index => board[index] === player));
    }

    function endGame(winner) {
      gameActive = false;
      if (winner === "draw") {
        document.getElementById('status').textContent = "കളി സമനിലയിൽ!";
        scores.draw++;
      } else {
        const winLine = getWinningLine(winner);
        if (winLine) {
          winLine.forEach(idx => document.getElementsByClassName('cell')[idx].classList.add('win'));
        }
        if (mode === 'ai') {
          document.getElementById('status').textContent = (winner === "X") ? "🎉 നിങ്ങൾ ജയിച്ചു!" : "🤖 AI ജയിച്ചു!";
        } else {
          document.getElementById('status').textContent = `🎉 പ്ലെയർ ${winner} ജയിച്ചു!`;
        }
        if (winner === "X") scores.p1++; else scores.p2++;
      }
      updateScoreboard();
    }

    function updateScoreboard() {
      document.getElementById('score-p1').textContent = scores.p1;
      document.getElementById('score-draw').textContent = scores.draw;
      document.getElementById('score-p2').textContent = scores.p2;
    }

    function resetBoard() {
      board = ["", "", "", "", "", "", "", "", ""];
      currentPlayer = "X";
      gameActive = true;
      document.getElementById('status').textContent = (mode === 'ai') ? "നിങ്ങളുടെ ഊഴം (X)" : "പ്ലെയർ X-ന്റെ ഊഴം";
      const cells = document.getElementsByClassName('cell');
      for (let cell of cells) {
        cell.textContent = "";
        cell.className = "cell";
      }
    }

    function clearScores() {
      scores = { p1: 0, draw: 0, p2: 0 };
      updateScoreboard();
      resetBoard();
    }

    // Minimax Unbeatable AI Algorithm
    function getBestMove() {
      let bestVal = -Infinity;
      let bestMove = -1;
      for (let i = 0; i < 9; i++) {
        if (board[i] === "") {
          board[i] = "O";
          let moveVal = minimax(board, 0, false);
          board[i] = "";
          if (moveVal > bestVal) {
            bestMove = i;
            bestVal = moveVal;
          }
        }
      }
      return bestMove;
    }

    function minimax(tempBoard, depth, isMax) {
      if (checkWin(tempBoard, "O")) return 10 - depth;
      if (checkWin(tempBoard, "X")) return depth - 10;
      if (tempBoard.every(cell => cell !== "")) return 0;

      if (isMax) {
        let maxVal = -Infinity;
        for (let i = 0; i < 9; i++) {
          if (tempBoard[i] === "") {
            tempBoard[i] = "O";
            maxVal = Math.max(maxVal, minimax(tempBoard, depth + 1, false));
            tempBoard[i] = "";
          }
        }
        return maxVal;
      } else {
        let minVal = Infinity;
        for (let i = 0; i < 9; i++) {
          if (tempBoard[i] === "") {
            tempBoard[i] = "X";
            minVal = Math.min(minVal, minimax(tempBoard, depth + 1, true));
            tempBoard[i] = "";
          }
        }
        return minVal;
      }
    }
  </script>
</body>
</html>

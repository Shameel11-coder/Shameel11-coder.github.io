<!DOCTYPE html>
<html lang="ml">
<head>
  <!-- Google tag (gtag.js) -->

    gtag('config', 'G-N7Z24SXFBG');

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shameel's Tic-Tac-Toe</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      background: #020617;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      overflow-x: hidden;
    }

    .hidden { display: none !important; }

    /* FULL POSTER WRAPPER */
    #start-screen {
      position: relative;
      width: 100%;
      max-width: 420px;
      border-radius: 26px;
      overflow: hidden;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(56, 189, 248, 0.25);
      border: 1.5px solid rgba(56, 189, 248, 0.3);
      user-select: none;
    }

    .poster-img {
      width: 100%;
      height: auto;
      display: block;
      pointer-events: none;
      user-select: none;
    }

    /* DIRECT ON-IMAGE CLICKABLE HOTSPOTS */
    .hotspot {
      position: absolute;
      cursor: pointer;
      border-radius: 16px;
      z-index: 99;
      background: rgba(255, 255, 255, 0.001);
      border: 2px solid transparent;
      transition: all 0.15s ease;
    }

    /* Mode: Unbeatable AI */
    #hotspot-ai {
      top: 49%;
      left: 13%;
      width: 40%;
      height: 9%;
    }

    /* Mode: 2 Players */
    #hotspot-2p {
      top: 49%;
      left: 55%;
      width: 33%;
      height: 9%;
    }

    /* Symbol: X */
    #hotspot-x {
      top: 63.5%;
      left: 13%;
      width: 39%;
      height: 9%;
    }

    /* Symbol: O */
    #hotspot-o {
      top: 63.5%;
      left: 54%;
      width: 33%;
      height: 9%;
    }

    /* Active Glowing State over selected option */
    .hotspot.selected {
      border: 2.5px solid #38bdf8 !important;
      background: rgba(56, 189, 248, 0.28) !important;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.7);
    }

    /* Start Button Hotspot */
    #hotspot-start {
      top: 73%;
      left: 12%;
      width: 76%;
      height: 11%;
      border-radius: 9999px;
    }

    #hotspot-start:active {
      background: rgba(250, 204, 21, 0.45) !important;
      box-shadow: 0 0 25px rgba(250, 204, 21, 0.9);
      transform: scale(0.97);
    }

    /* GAME PLAY SCREEN */
    #game-screen {
      width: 100%;
      max-width: 390px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      animation: popIn 0.3s ease;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .game-top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    .scoreboard-box {
      width: 100%;
      display: flex;
      gap: 8px;
    }

    .score-card {
      flex: 1;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #334155;
      padding: 10px 4px;
      border-radius: 16px;
      text-align: center;
    }

    .score-title { font-size: 0.72rem; color: #94a3b8; font-weight: 600; }
    .score-val { font-size: 1.45rem; font-weight: 900; color: #38bdf8; }

    .game-status-bubble {
      background: #1e293b;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 8px 20px;
      border-radius: 9999px;
      font-weight: 700;
      color: #e2e8f0;
      font-size: 0.92rem;
    }

    .game-board {
      width: 100%;
      aspect-ratio: 1/1;
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid rgba(56, 189, 248, 0.3);
      border-radius: 24px;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    }

    .cell {
      background: #090d16;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: 900;
      cursor: pointer;
      border: 1px solid #1e293b;
      user-select: none;
      transition: all 0.15s ease;
    }

    .cell:active { transform: scale(0.94); }
    .cell.x { color: #38bdf8; text-shadow: 0 0 16px rgba(56, 189, 248, 0.8); }
    .cell.o { color: #ec4899; text-shadow: 0 0 16px rgba(236, 72, 153, 0.8); }
    .cell.win-cell { background: #1e3a5f; border-color: #38bdf8; animation: pulseWin 0.8s infinite alternate; }
    @keyframes pulseWin { from { transform: scale(0.98); } to { transform: scale(1.04); } }
  </style>
</head>
<body>

  <!-- FULL 3D POSTER SCREEN WITH DIRECT TOUCH -->
  <div id="start-screen">
    <img src="file_0000000074188208aabdc190d10e5f39.png" alt="3D Tic Tac Toe Poster" class="poster-img">

    <!-- Mode Hotspots -->
    <button type="button" id="hotspot-ai" class="hotspot selected" onclick="pickMode('ai')"></button>
    <button type="button" id="hotspot-2p" class="hotspot" onclick="pickMode('2p')"></button>

    <!-- Symbol Hotspots -->
    <button type="button" id="hotspot-x" class="hotspot selected" onclick="pickSym('X')"></button>
    <button type="button" id="hotspot-o" class="hotspot" onclick="pickSym('O')"></button>

    <!-- Start Game Button Hotspot -->
    <button type="button" id="hotspot-start" class="hotspot" onclick="launchGame()"></button>
  </div>

  <!-- GAME PLAY SCREEN -->
  <div id="game-screen" class="hidden">
    <div class="game-top-bar">
      <button class="nav-btn" onclick="goToHome()">⬅️ Back</button>
      <span id="label-game-mode" style="font-size:0.85rem; color:#38bdf8; font-weight:700;">Unbeatable AI</span>
      <button class="nav-btn" onclick="resetCurrentGame()">🔄 Restart</button>
    </div>

    <div class="scoreboard-box">
      <div class="score-card">
        <div class="score-title" id="p1-name">You (X)</div>
        <div class="score-val" id="val-score-p1">0</div>
      </div>
      <div class="score-card">
        <div class="score-title">Draw</div>
        <div class="score-val" id="val-score-draw">0</div>
      </div>
      <div class="score-card">
        <div class="score-title" id="p2-name">AI (O)</div>
        <div class="score-val" id="val-score-p2">0</div>
      </div>
    </div>

    <div class="game-status-bubble" id="game-status">Ningalude oozham (X)</div>

    <div class="game-board" id="board">
      <div class="cell" onclick="handleMove(0)"></div>
      <div class="cell" onclick="handleMove(1)"></div>
      <div class="cell" onclick="handleMove(2)"></div>
      <div class="cell" onclick="handleMove(3)"></div>
      <div class="cell" onclick="handleMove(4)"></div>
      <div class="cell" onclick="handleMove(5)"></div>
      <div class="cell" onclick="handleMove(6)"></div>
      <div class="cell" onclick="handleMove(7)"></div>
      <div class="cell" onclick="handleMove(8)"></div>
    </div>
  </div>

  <script>
    let mode = 'ai';
    let humanSymbol = 'X';
    let aiSymbol = 'O';
    let board = ["", "", "", "", "", "", "", "", ""];
    let currentTurn = "X";
    let isGamePlayable = true;
    let scores = { p1: 0, draw: 0, p2: 0 };

    const winCombos = [
      [0,1,2], [3,4,5], [6,7,8],
      [0,3,6], [1,4,7], [2,5,8],
      [0,4,8], [2,4,6]
    ];

    function pickMode(m) {
      mode = m;
      document.getElementById('hotspot-ai').classList.toggle('selected', m === 'ai');
      document.getElementById('hotspot-2p').classList.toggle('selected', m === '2p');
    }

    function pickSym(s) {
      humanSymbol = s;
      aiSymbol = (s === 'X') ? 'O' : 'X';
      document.getElementById('hotspot-x').classList.toggle('selected', s === 'X');
      document.getElementById('hotspot-o').classList.toggle('selected', s === 'O');
    }

    function launchGame() {
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');

      if (mode === 'ai') {
        document.getElementById('label-game-mode').textContent = "Unbeatable AI";
        document.getElementById('p1-name').textContent = `You (${humanSymbol})`;
        document.getElementById('p2-name').textContent = `AI (${aiSymbol})`;
      } else {
        document.getElementById('label-game-mode').textContent = "2 Players";
        document.getElementById('p1-name').textContent = "Player (X)";
        document.getElementById('p2-name').textContent = "Player (O)";
      }

      resetCurrentGame();
    }

    function goToHome() {
      document.getElementById('game-screen').classList.add('hidden');
      document.getElementById('start-screen').classList.remove('hidden');
    }

    function handleMove(idx) {
      if (board[idx] !== "" || !isGamePlayable) return;

      playStep(idx, currentTurn);

      if (checkWin(board, currentTurn)) {
        finishGame(currentTurn);
        return;
      }

      if (board.every(cell => cell !== "")) {
        finishGame("draw");
        return;
      }

      if (mode === 'ai') {
        currentTurn = aiSymbol;
        isGamePlayable = false;
        document.getElementById('game-status').textContent = "AI chinthikkunnu... 🤖";
        
        setTimeout(() => {
          const aiBest = getBestMove();
          playStep(aiBest, aiSymbol);

          if (checkWin(board, aiSymbol)) {
            finishGame(aiSymbol);
          } else if (board.every(c => c !== "")) {
            finishGame("draw");
          } else {
            currentTurn = humanSymbol;
            isGamePlayable = true;
            document.getElementById('game-status').textContent = `Ningalude oozham (${humanSymbol})`;
          }
        }, 400);
      } else {
        currentTurn = (currentTurn === "X") ? "O" : "X";
        document.getElementById('game-status').textContent = `Player ${currentTurn}-nte oozham`;
      }
    }

    function playStep(idx, player) {
      board[idx] = player;
      const el = document.getElementsByClassName('cell')[idx];
      el.textContent = player;
      el.classList.add(player.toLowerCase());
    }

    function checkWin(b, player) {
      return winCombos.some(combo => combo.every(i => b[i] === player));
    }

    function getWinPath(player) {
      return winCombos.find(combo => combo.every(i => board[i] === player));
    }

    function finishGame(winner) {
      isGamePlayable = false;
      if (winner === "draw") {
        document.getElementById('game-status').textContent = "Kali samanilayil! 🤝";
        scores.draw++;
      } else {
        const path = getWinPath(winner);
        if (path) {
          path.forEach(i => document.getElementsByClassName('cell')[i].classList.add('win-cell'));
        }
        if (mode === 'ai') {
          document.getElementById('game-status').textContent = (winner === humanSymbol) ? "🎉 Ningal jayichu!" : "🤖 AI jayichu!";
          if (winner === humanSymbol) scores.p1++; else scores.p2++;
        } else {
          document.getElementById('game-status').textContent = `🎉 Player ${winner} jayichu!`;
          if (winner === "X") scores.p1++; else scores.p2++;
        }
      }
      refreshScores();
    }

    function refreshScores() {
      document.getElementById('val-score-p1').textContent = scores.p1;
      document.getElementById('val-score-draw').textContent = scores.draw;
      document.getElementById('val-score-p2').textContent = scores.p2;
    }

    function resetCurrentGame() {
      board = ["", "", "", "", "", "", "", "", ""];
      currentTurn = "X";
      isGamePlayable = true;
      const cells = document.getElementsByClassName('cell');
      for (let c of cells) {
        c.textContent = "";
        c.className = "cell";
      }

      if (mode === 'ai') {
        if (humanSymbol === 'O') {
          isGamePlayable = false;
          document.getElementById('game-status').textContent = "AI chinthikkunnu... 🤖";
          setTimeout(() => {
            const initialCorners = [0, 2, 4, 6, 8];
            const move = initialCorners[Math.floor(Math.random() * initialCorners.length)];
            playStep(move, 'X');
            currentTurn = 'O';
            isGamePlayable = true;
            document.getElementById('game-status').textContent = "Ningalude oozham (O)";
          }, 350);
        } else {
          document.getElementById('game-status').textContent = "Ningalude oozham (X)";
        }
      } else {
        document.getElementById('game-status').textContent = "Player X-nte oozham";
      }
    }

    function getBestMove() {
      let bestScore = -Infinity;
      let move = -1;
      for (let i = 0; i < 9; i++) {
        if (board[i] === "") {
          board[i] = aiSymbol;
          let score = runMinimax(board, 0, false);
          board[i] = "";
          if (score > bestScore) {
            bestScore = score;
            move = i;
          }
        }
      }
      return move;
    }

    function runMinimax(b, depth, isMaximizing) {
      if (checkWin(b, aiSymbol)) return 10 - depth;
      if (checkWin(b, humanSymbol)) return depth - 10;
      if (b.every(c => c !== "")) return 0;

      if (isMaximizing) {
        let maxVal = -Infinity;
        for (let i = 0; i < 9; i++) {
          if (b[i] === "") {
            b[i] = aiSymbol;
            maxVal = Math.max(maxVal, runMinimax(b, depth + 1, false));
            b[i] = "";
          }
        }
        return maxVal;
      } else {
        let minVal = Infinity;
        for (let i = 0; i < 9; i++) {
          if (b[i] === "") {
            b[i] = humanSymbol;
            minVal = Math.min(minVal, runMinimax(b, depth + 1, true));
            b[i] = "";
          }
        }
        return minVal;
      }
    }
  </script>
</body>
</html>

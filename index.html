<!DOCTYPE html>
<html lang="ml">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-N7Z24SXFBG"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-N7Z24SXFBG');

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shameel's Tic-Tac-Toe</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: radial-gradient(circle at center, #1e293b, #0a0f1d);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    /* Screen Transitions */
    .screen {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      animation: fadeIn 0.3s ease;
    }
    .hidden {
      display: none !important;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* WELCOME SCREEN / THUMBNAIL */
    .hero-card {
      width: 100%;
      background: #1e293b80;
      border: 1px solid #334155;
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .game-logo {
      width: 90px;
      height: 90px;
      border-radius: 20px;
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      font-weight: 900;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.5);
      letter-spacing: -2px;
    }
    .hero-title {
      font-size: 2.2rem;
      font-weight: 800;
      color: #38bdf8;
      text-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
    }
    .hero-subtitle {
      font-size: 0.95rem;
      color: #94a3b8;
    }
    .option-group {
      width: 100%;
      text-align: left;
      margin-top: 6px;
    }
    .option-label {
      font-size: 0.85rem;
      color: #cbd5e1;
      margin-bottom: 8px;
      display: block;
      font-weight: 600;
    }
    .selector-box {
      display: flex;
      background: #0f172a;
      border-radius: 12px;
      padding: 4px;
      border: 1px solid #334155;
      gap: 6px;
    }
    .sel-btn {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: none;
      color: #94a3b8;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }
    .sel-btn.active {
      background: #38bdf8;
      color: #0f172a;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }
    .btn-start {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(90deg, #38bdf8, #0284c7);
      color: #0f172a;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(56, 189, 248, 0.4);
      transition: transform 0.15s, box-shadow 0.15s;
      margin-top: 8px;
    }
    .btn-start:active {
      transform: scale(0.98);
      box-shadow: 0 2px 10px rgba(56, 189, 248, 0.3);
    }

    /* GAME SCREEN */
    .game-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .scoreboard {
      display: flex;
      justify-content: space-between;
      width: 100%;
      gap: 10px;
    }
    .score-card {
      background: #1e293b;
      flex: 1;
      padding: 10px 8px;
      border-radius: 14px;
      text-align: center;
      border: 1px solid #334155;
    }
    .score-title { font-size: 0.75rem; color: #94a3b8; }
    .score-value { font-size: 1.4rem; font-weight: bold; margin-top: 4px; color: #38bdf8; }
    .status {
      font-size: 1.1rem;
      font-weight: 600;
      color: #f1f5f9;
      min-height: 28px;
      text-align: center;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #1e293b80;
      padding: 14px;
      border-radius: 20px;
      border: 1px solid #334155;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .cell {
      background: #0f172a;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      font-weight: 800;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s, transform 0.1s;
    }
    .cell:active { transform: scale(0.95); }
    .cell.x { color: #38bdf8; text-shadow: 0 0 12px rgba(56, 189, 248, 0.4); }
    .cell.o { color: #f43f5e; text-shadow: 0 0 12px rgba(244, 63, 94, 0.4); }
    .cell.win {
      background: #1e3a5f;
      animation: pulse 0.8s infinite alternate;
    }
    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.05); }
    }
    .controls {
      display: flex;
      gap: 10px;
      width: 100%;
    }
    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-reset { background: #38bdf8; color: #0f172a; }
    .btn-clear { background: #334155; color: #cbd5e1; }
  </style>
</head>
<body>

  <!-- WELCOME / START SCREEN -->
  <div id="start-screen" class="screen">
    <div class="hero-card">
      <div class="game-logo">XO</div>
      <h1 class="hero-title">Tic-Tac-Toe</h1>
      <p class="hero-subtitle">കളിക്കാൻ റെഡിയാണോ? മോഡ് തിരഞ്ഞെടുത്ത് തുടങ്ങാം!</p>

      <div class="option-group">
        <span class="option-label">ഗെയിം മോഡ് തിരഞ്ഞെടുക്കുക</span>
        <div class="selector-box">
          <button class="sel-btn active" id="btn-mode-ai" onclick="chooseMode('ai')">🤖 Unbeatable AI</button>
          <button class="sel-btn" id="btn-mode-2p" onclick="chooseMode('2p')">👥 2 Players</button>
        </div>
      </div>

      <div class="option-group" id="symbol-group">
        <span class="option-label">നിങ്ങളുടെ ചിഹ്നം</span>
        <div class="selector-box">
          <button class="sel-btn active" id="btn-sym-x" onclick="chooseSymbol('X')">X (ആദ്യം കളിക്കുക)</button>
          <button class="sel-btn" id="btn-sym-o" onclick="chooseSymbol('O')">O (രണ്ടാമത്)</button>
        </div>
      </div>

      <button class="btn-start" onclick="startGame()">START GAME 🚀</button>
    </div>
  </div>

  <!-- MAIN GAME SCREEN -->
  <div id="game-screen" class="screen hidden">
    <div class="game-header">
      <button class="header-btn" onclick="backToHome()">⬅️ Home</button>
      <span id="current-mode-tag" style="font-size:0.85rem; color:#94a3b8; font-weight:600;">AI Mode</span>
      <button class="header-btn" onclick="resetBoard()">🔄 Restart</button>
    </div>

    <div class="scoreboard">
      <div class="score-card">
        <div class="score-title" id="p1-label">Player (X)</div>
        <div class="score-value" id="score-p1">0</div>
      </div>
      <div class="score-card">
        <div class="score-title">Draw</div>
        <div class="score-value" id="score-draw">0</div>
      </div>
      <div class="score-card">
        <div class="score-title" id="p2-label">AI (O)</div>
        <div class="score-value" id="score-p2">0</div>
      </div>
    </div>

    <div class="status" id="status">ലോഡ് ചെയ്യുന്നു...</div>

    <div class="board" id="board">
      <div class="cell" onclick="handleCellClick(0)"></div>
      <div class="cell" onclick="handleCellClick(1)"></div>
      <div class="cell" onclick="handleCellClick(2)"></div>
      <div class="cell" onclick="handleCellClick(3)"></div>
      <div class="cell" onclick="handleCellClick(4)"></div>
      <div class="cell" onclick="handleCellClick(5)"></div>
      <div class="cell" onclick="handleCellClick(6)"></div>
      <div class="cell" onclick="handleCellClick(7)"></div>
      <div class="cell" onclick="handleCellClick(8)"></div>
    </div>

    <div class="controls">
      <button class="btn btn-clear" onclick="clearScores()">Reset Score</button>
    </div>
  </div>

  <script>
    let mode = 'ai';
    let humanSymbol = 'X';
    let aiSymbol = 'O';
    let board = ["", "", "", "", "", "", "", "", ""];
    let currentPlayer = "X";
    let gameActive = true;
    let scores = { p1: 0, draw: 0, p2: 0 };

    const winConditions = [
      [0,1,2], [3,4,5], [6,7,8],
      [0,3,6], [1,4,7], [2,5,8],
      [0,4,8], [2,4,6]
    ];

    function chooseMode(selected) {
      mode = selected;
      document.getElementById('btn-mode-ai').classList.toggle('active', mode === 'ai');
      document.getElementById('btn-mode-2p').classList.toggle('active', mode === '2p');
      document.getElementById('symbol-group').style.display = (mode === 'ai') ? 'block' : 'none';
    }

    function chooseSymbol(symbol) {
      humanSymbol = symbol;
      aiSymbol = (symbol === 'X') ? 'O' : 'X';
      document.getElementById('btn-sym-x').classList.toggle('active', symbol === 'X');
      document.getElementById('btn-sym-o').classList.toggle('active', symbol === 'O');
    }

    function startGame() {
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');

      if (mode === 'ai') {
        document.getElementById('current-mode-tag').textContent = "Smart AI Mode";
        document.getElementById('p1-label').textContent = `You (${humanSymbol})`;
        document.getElementById('p2-label').textContent = `AI (${aiSymbol})`;
      } else {
        document.getElementById('current-mode-tag').textContent = "2 Players";
        document.getElementById('p1-label').textContent = "Player (X)";
        document.getElementById('p2-label').textContent = "Player (O)";
      }

      resetBoard();
    }

    function backToHome() {
      document.getElementById('game-screen').classList.add('hidden');
      document.getElementById('start-screen').classList.remove('hidden');
    }

    function handleCellClick(index) {
      if (board[index] !== "" || !gameActive) return;

      makeMove(index, currentPlayer);

      if (checkWin(board, currentPlayer)) {
        endGame(currentPlayer);
        return;
      }

      if (board.every(cell => cell !== "")) {
        endGame("draw");
        return;
      }

      if (mode === 'ai') {
        currentPlayer = aiSymbol;
        gameActive = false;
        document.getElementById('status').textContent = "AI ചിന്തിക്കുന്നു...";
        setTimeout(() => {
          const bestMove = getBestMove();
          makeMove(bestMove, aiSymbol);
          if (checkWin(board, aiSymbol)) {
            endGame(aiSymbol);
          } else if (board.every(cell => cell !== "")) {
            endGame("draw");
          } else {
            currentPlayer = humanSymbol;
            gameActive = true;
            document.getElementById('status').textContent = "നിങ്ങളുടെ ഊഴം (" + humanSymbol + ")";
          }
        }, 400);
      } else {
        currentPlayer = (currentPlayer === "X") ? "O" : "X";
        document.getElementById('status').textContent = `പ്ലെയർ ${currentPlayer}-ന്റെ ഊഴം`;
      }
    }

    function makeMove(index, player) {
      board[index] = player;
      const cell = document.getElementsByClassName('cell')[index];
      cell.textContent = player;
      cell.classList.add(player.toLowerCase());
    }

    function checkWin(b, player) {
      return winConditions.some(condition => condition.every(index => b[index] === player));
    }

    function getWinningLine(player) {
      return winConditions.find(condition => condition.every(index => board[index] === player));
    }

    function endGame(winner) {
      gameActive = false;
      if (winner === "draw") {
        document.getElementById('status').textContent = "കളി സമനിലയിൽ!";
        scores.draw++;
      } else {
        const winLine = getWinningLine(winner);
        if (winLine) {
          winLine.forEach(idx => document.getElementsByClassName('cell')[idx].classList.add('win'));
        }
        if (mode === 'ai') {
          document.getElementById('status').textContent = (winner === humanSymbol) ? "🎉 നിങ്ങൾ ജയിച്ചു!" : "🤖 AI ജയിച്ചു!";
          if (winner === humanSymbol) scores.p1++; else scores.p2++;
        } else {
          document.getElementById('status').textContent = `🎉 പ്ലെയർ ${winner} ജയിച്ചു!`;
          if (winner === "X") scores.p1++; else scores.p2++;
        }
      }
      updateScoreboard();
    }

    function updateScoreboard() {
      document.getElementById('score-p1').textContent = scores.p1;
      document.getElementById('score-draw').textContent = scores.draw;
      document.getElementById('score-p2').textContent = scores.p2;
    }

    function resetBoard() {
      board = ["", "", "", "", "", "", "", "", ""];
      currentPlayer = "X";
      gameActive = true;
      const cells = document.getElementsByClassName('cell');
      for (let cell of cells) {
        cell.textContent = "";
        cell.className = "cell";
      }

      if (mode === 'ai') {
        if (humanSymbol === 'O') {
          // AI goes first if player chose O
          gameActive = false;
          document.getElementById('status').textContent = "AI തുടങ്ങുന്നു...";
          setTimeout(() => {
            const firstMove = [0, 2, 4, 6, 8][Math.floor(Math.random() * 5)];
            makeMove(firstMove, 'X');
            currentPlayer = 'O';
            gameActive = true;
            document.getElementById('status').textContent = "നിങ്ങളുടെ ഊഴം (O)";
          }, 400);
        } else {
          document.getElementById('status').textContent = "നിങ്ങളുടെ ഊഴം (X)";
        }
      } else {
        document.getElementById('status').textContent = "പ്ലെയർ X-ന്റെ ഊഴം";
      }
    }

    function clearScores() {
      scores = { p1: 0, draw: 0, p2: 0 };
      updateScoreboard();
      resetBoard();
    }

    // Minimax Unbeatable AI
    function getBestMove() {
      let bestVal = -Infinity;
      let bestMove = -1;
      for (let i = 0; i < 9; i++) {
        if (board[i] === "") {
          board[i] = aiSymbol;
          let moveVal = minimax(board, 0, false);
          board[i] = "";
          if (moveVal > bestVal) {
            bestMove = i;
            bestVal = moveVal;
          }
        }
      }
      return bestMove;
    }

    function minimax(tempBoard, depth, isMax) {
      if (checkWin(tempBoard, aiSymbol)) return 10 - depth;
      if (checkWin(tempBoard, humanSymbol)) return depth - 10;
      if (tempBoard.every(cell => cell !== "")) return 0;

      if (isMax) {
        let maxVal = -Infinity;
        for (let i = 0; i < 9; i++) {
          if (tempBoard[i] === "") {
            tempBoard[i] = aiSymbol;
            maxVal = Math.max(maxVal, minimax(tempBoard, depth + 1, false));
            tempBoard[i] = "";
          }
        }
        return maxVal;
      } else {
        let minVal = Infinity;
        for (let i = 0; i < 9; i++) {
          if (tempBoard[i] === "") {
            tempBoard[i] = humanSymbol;
            minVal = Math.min(minVal, minimax(tempBoard, depth + 1, true));
            tempBoard[i] = "";
          }
        }
        return minVal;
      }
    }
  </script>
</body>
</html>
